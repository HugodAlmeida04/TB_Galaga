<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Galaga 3D - Save State</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        
        /* Interface de Jogo */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-align: center;
            display: none; 
            pointer-events: none; 
            z-index: 10;
        }
        .hud-container {
            display: flex; justify-content: space-around; padding-top: 20px;
        }
        .titulo { color: red; font-size: 28px; }
        .valor { color: white; font-size: 28px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="hud">
        <div class="hud-container">
            <div>
                <div class="titulo">1UP</div>
                <div id="pontuacao" class="valor">0</div>
            </div>
            <div>
                <div class="titulo">HIGH SCORE</div>
                <div id="highscore" class="valor">20000</div>
            </div>
            <div>
                <div class="titulo">VIDAS</div>
                <div id="vidas" class="valor">3</div>
            </div>
        </div>
    </div>
    

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- VARIÁVEIS GLOBAIS ---
        let scene, renderer, controls;
        let cameraPerspetiva, cameraOrtografica, cameraAtiva;
        let naveJogador;
        
        // Arrays de Jogo
        let lasers = []; 
        let grupoFrota; 
        let arrayInimigos = [];
        let explosoes = [];

        // Estado do Jogo
        let teclas = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
        let ultimoDisparo = 0; 
        let ultimoAtaqueInimigo = 0;
        
        // Variáveis do HUD
        let pontos = 0;
        let pontuacaoMaxima = 20000;
        let vidas = 3;
        let hudVisivel = false;
        
        const TETO_INIMIGOS = 50; // O limite máximo para proteger os FPS
        let ultimoReforco = 0;    // Temporizador
        let catalogoNaves = {};   // Guarda as plantas das naves para reutilizarmos

        let invulneravel = false;
        let tempoInvulneravel = 0;

        let proximoBonusVida = 10000; // Define o primeiro patamar para a vida extra


        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            

            configurarCamaras();
            configurarLuzes();
            criarNave();
            criarFrota();

            controls = new OrbitControls(cameraPerspetiva, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = false;
            controls.minDistance = 10;
            controls.maxDistance = 60;

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
        }

        // --- SISTEMA DE UI (HUD) ---
        function atualizarHUD() {
            if (pontos > pontuacaoMaxima) pontuacaoMaxima = pontos;

            if (pontos >= proximoBonusVida) {
                vidas++;
                proximoBonusVida += 10000; // Incrementa o próximo objetivo (20k, 30k, etc.)
                
                // Feedback visual opcional: podes fazer a luz da nave brilhar 
                // ou simplesmente um log para debug
                console.log("Parabéns! Vida extra ganha. Próximo objetivo: " + proximoBonusVida);
            }

            document.getElementById('pontuacao').innerText = pontos;
            document.getElementById('highscore').innerText = pontuacaoMaxima;
            document.getElementById('vidas').innerText = vidas;
        }

       // --- CÂMARAS E LUZES ---
        function configurarCamaras() {
            const aspeto = window.innerWidth / window.innerHeight;
            
            cameraPerspetiva = new THREE.PerspectiveCamera(45, aspeto, 0.1, 1000);
            cameraPerspetiva.position.set(0, -32, 18); // Faltava esta linha!
            
            const frustumSize = 85; 
            cameraOrtografica = new THREE.OrthographicCamera(
                (frustumSize * aspeto) / -2, (frustumSize * aspeto) / 2, 
                frustumSize / 2, frustumSize / -2, 0.1, 1000
            );
            cameraOrtografica.position.set(0, 5, 25); // Faltava esta linha!

            cameraAtiva = cameraOrtografica; 
        }

        function configurarLuzes() {
            const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.2); 
            scene.add(luzAmbiente);

            const luzDirecional = new THREE.DirectionalLight(0xffffff, 1.2);
            luzDirecional.position.set(0, 20, 10);
            scene.add(luzDirecional);
        }

        // --- FÁBRICAS DE MODELOS ---
        function criarNave() {
            naveJogador = new THREE.Group();
            const geometria = new THREE.BoxGeometry(1, 1, 1);
            

            const cB = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 }); // Branco
            const cV = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 }); // Vermelho
            const cA = new THREE.MeshStandardMaterial({ color: 0x0055ff, emissive: 0x001155 }); // Azul
            const cVerde = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x004400 }); // Verde
            const cVerdeEscuro = new THREE.MeshStandardMaterial({ color: 0x008800, emissive: 0x002200 }); // Verde Escuro
            const cCiano = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444 }); // Ciano
            const cAmarelo = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x444400 }); // Amarelo
            const cRoxo = new THREE.MeshStandardMaterial({ color: 0xaa00ff, emissive: 0x220044 }); // Roxo

            const designNave = [
                [0, 10, cA], [0, 9, cA], [0, 8, cA], [0, 7, cA], [0, 6, cB],
                [-1, 8, cB], [1, 8, cB], [-1, 7, cB], [1, 7, cB], [-1, 6, cB], [1, 6, cB], [-2, 6, cB], [2, 6, cB],
                [-3, 6, cCiano], [3, 6, cCiano], [-4, 6, cCiano], [4, 6, cCiano],
                [-3, 5, cB], [3, 5, cB], [-4, 5, cB], [4, 5, cB],
                [-5, 5, cCiano], [5, 5, cCiano], [-6, 5, cCiano], [6, 5, cCiano],
                [-7, 4, cCiano], [7, 4, cCiano], [-8, 4, cCiano], [8, 4, cCiano],
                [-7, 3, cB], [7, 3, cB], [-8, 3, cB], [8, 3, cB],
                [-9, 3, cV], [9, 3, cV], [-10, 2, cV], [10, 2, cV],
                [-2, 3, cV], [2, 3, cV], [-2, 2, cV], [2, 2, cV],
                [-1, 1, cA], [1, 1, cA], [-1, 0, cV], [1, 0, cV],
                [-2, 0, cA], [2, 0, cA], [-3, -1, cV], [3, -1, cV]
            ];

            designNave.forEach(bloco => {
                const cubo = new THREE.Mesh(geometria, bloco[2]);
                cubo.position.set(bloco[0], bloco[1], 0);
                naveJogador.add(cubo);
            });

            naveJogador.scale.set(0.4, 0.4, 0.4);
            naveJogador.position.set(0, -15, 0); 
            scene.add(naveJogador);
        }

        function fabricarInimigo(matrizDesign, valorPontos) {
            const inimigo = new THREE.Group();
            const geometria = new THREE.BoxGeometry(1, 1, 1);
            matrizDesign.forEach(bloco => {
                const cubo = new THREE.Mesh(geometria, bloco[2]);
                cubo.position.set(bloco[0], bloco[1], 0);
                inimigo.add(cubo);
            });
            inimigo.scale.set(0.35, 0.35, 0.35); 
            inimigo.userData.pontos = valorPontos; 
            inimigo.userData.estado = 'FROTA';
            return inimigo;
        }

        function criarFrota() {
            grupoFrota = new THREE.Group();
            const cB = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 }); // Branco
            const cV = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 }); // Vermelho
            const cA = new THREE.MeshStandardMaterial({ color: 0x0055ff, emissive: 0x001155 }); // Azul
            const cVerde = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x004400 }); // Verde
            const cVerdeEscuro = new THREE.MeshStandardMaterial({ color: 0x008800, emissive: 0x002200 }); // Verde Escuro
            const cCiano = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444 }); // Ciano
            const cAmarelo = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x444400 }); // Amarelo
            const cRoxo = new THREE.MeshStandardMaterial({ color: 0xaa00ff, emissive: 0x220044 }); // Roxo

            const designZako = [
                [-2, 5, cV], [2, 5, cV], [-3, 4, cV], [3, 4, cV], [-2, 4, cCiano], [2, 4, cCiano],
                // Corpo Superior (Ciano e Branco)
                [-1, 3, cCiano], [1, 3, cCiano], [-1, 2, cB], [1, 2, cB], [0, 2, cAmarelo], 
                [-2, 1, cCiano], [2, 1, cCiano], [-2, 2, cB], [2, 2, cB],
                // Núcleo Central (Vermelho e Amarelo)
                [0, 1, cAmarelo], [0, 0, cV], [-1, 0, cV], [1, 0, cV],
                // Corpo Inferior (Ciano)
                [-3, -1, cCiano], [3, -1, cCiano], [-2, -2, cCiano], [2, -2, cCiano], [-1, -3, cCiano], [1, -3, cCiano],
                // Pontas Laterais (Branco)
                [-4, -1, cB], [4, -1, cB], [-4, -2, cB], [4, -2, cB]
            ];

            const designGoei = [
              [0, 3, cAmarelo], [0, 2, cAmarelo], [0, 1, cV], [0, 0, cV], [-1, 2, cAmarelo], [1, 2, cAmarelo],
                // Asas Superiores (Verde)
                [-1, 3, cVerde], [1, 3, cVerde], [-2, 3, cVerde], [2, 3, cVerde], [-3, 2, cVerde], [2, 2, cVerde],
                // Asas Inferiores (Branco)
                [-2, 1, cB], [2, 1, cB], [-3, 0, cB], [3, 0, cB], [-2, -1, cB], [2, -1, cB], [-1, -2, cB], [1, -2, cB]
            ];

            const designBoss = [
                [0, 2, cA], [0, 1, cA], [-1, 1, cCiano], [1, 1, cCiano],
                // Corpo e Asas Curtas (Azul, Vermelho, Branco)
                [-1, 0, cA], [1, 0, cA], [0, 0, cV],
                [-2, -1, cA], [2, -1, cA], [-3, -1, cB], [3, -1, cB],
                [-2, -2, cV], [2, -2, cV], [-1, -3, cV], [1, -3, cV],
                [-1, -2, cB], [1, -2, cB]
            ];

            catalogoNaves.Zako = designZako;
            catalogoNaves.Goei = designGoei;
            catalogoNaves.Boss = designBoss;

            const colunas = 10;
            const linhas = 5; 
            const espacamentoX = 6.5; 
            const espacamentoY = 4.5; 

            for (let linha = 0; linha < linhas; linha++) {
                for (let col = 0; col < colunas; col++) {
                    let designEscolhido;
                    let pontosDestaNave;

                    if (linha === 0) {
                        designEscolhido = designBoss; 
                        pontosDestaNave = 400;
                    } else if (linha === 1 || linha === 2) {
                        designEscolhido = designGoei;
                        pontosDestaNave = 160;
                    } else {
                        designEscolhido = designZako;
                        pontosDestaNave = 80;
                    }

                    const inimigo = fabricarInimigo(designEscolhido, pontosDestaNave);
                    inimigo.position.x = (col * espacamentoX) - ((colunas - 1) * espacamentoX) / 2;
                    inimigo.position.y = - (linha * espacamentoY);
                    
                    grupoFrota.add(inimigo);
                    arrayInimigos.push(inimigo);
                }
            }

            grupoFrota.position.set(0, 26, 0); 
            scene.add(grupoFrota);
        }

        // --- SISTEMA DE COMBATE (TIRO DUPLO LIVRE) ---
        function disparar() {
            // Removido o bloqueio de tempo (ultimoDisparo)! Dispara sempre que é chamada.
            const geometriaLaser = new THREE.CylinderGeometry(0.15, 0.15, 2.0); 
            const materialLaser = new THREE.MeshBasicMaterial({ color: 0xff0000 });

            const angulo = naveJogador.rotation.z;
            const dirX = -Math.sin(angulo);
            const dirY = Math.cos(angulo);
            const latX = Math.cos(angulo);
            const latY = Math.sin(angulo);
            
            const velocidadeTiro = 1.2;
            const envergadura = 1.4; 
            const projecao = 2.5;    

            // ... (O resto do código de criar o laserEsq e laserDir mantém-se igual)
            const laserEsq = new THREE.Mesh(geometriaLaser, materialLaser);
            laserEsq.position.x = naveJogador.position.x - (latX * envergadura) + (dirX * projecao);
            laserEsq.position.y = naveJogador.position.y - (latY * envergadura) + (dirY * projecao);
            laserEsq.rotation.z = angulo;
            laserEsq.userData.velX = dirX * velocidadeTiro;
            laserEsq.userData.velY = dirY * velocidadeTiro;
            scene.add(laserEsq);
            lasers.push(laserEsq);

            const laserDir = new THREE.Mesh(geometriaLaser, materialLaser);
            laserDir.position.x = naveJogador.position.x + (latX * envergadura) + (dirX * projecao);
            laserDir.position.y = naveJogador.position.y + (latY * envergadura) + (dirY * projecao);
            laserDir.rotation.z = angulo;
            laserDir.userData.velX = dirX * velocidadeTiro;
            laserDir.userData.velY = dirY * velocidadeTiro;
            scene.add(laserDir);
            lasers.push(laserDir);
        }

        function criarExplosao(posicaoMundo) {
            const grupoExplosao = new THREE.Group();
            grupoExplosao.position.copy(posicaoMundo); 

            const cores = [0xffff00, 0x00ffff, 0xffffff]; 
            const geometriaPixel = new THREE.BoxGeometry(0.8, 0.8, 0.8);

            for (let i = 0; i < 8; i++) {
                const material = new THREE.MeshBasicMaterial({ 
                    color: cores[Math.floor(Math.random() * cores.length)] 
                });
                const fragmento = new THREE.Mesh(geometriaPixel, material);
                
                const angulo = (i / 8) * Math.PI * 2;
                const velocidadeEstilhaco = 0.6;
                fragmento.userData.velX = Math.cos(angulo) * velocidadeEstilhaco;
                fragmento.userData.velY = Math.sin(angulo) * velocidadeEstilhaco;
                
                grupoExplosao.add(fragmento);
            }

            grupoExplosao.userData.tempoVida = 20; 
            scene.add(grupoExplosao);
            explosoes.push(grupoExplosao);
        }

        // --- INTELIGÊNCIA ARTIFICIAL ---
        function gerirAtaques() {
            const agora = Date.now();
            
            if (agora - ultimoAtaqueInimigo > 2000) {
                ultimoAtaqueInimigo = agora;

                const navesNaFrota = arrayInimigos.filter(inimigo => inimigo.userData.estado === 'FROTA');
                
                if (navesNaFrota.length > 0) {
                    const kamikaze = navesNaFrota[Math.floor(Math.random() * navesNaFrota.length)];
                    kamikaze.userData.estado = 'ATACANDO';
                    
                    scene.attach(kamikaze); 
                    
                    kamikaze.userData.tempoMergulho = 0;
                    const direcaoAoJogador = naveJogador.position.x > kamikaze.position.x ? 1 : -1;
                    kamikaze.userData.curvaX = direcaoAoJogador * 0.15; 
                }
            }
        }

        // --- INTELIGÊNCIA ARTIFICIAL: REFORÇOS ---
        function gerirReforcos() {
            const agora = Date.now();
            
            // Se houver espaço no "teto" e tiver passado 1.5 segundos desde o último reforço
            if (arrayInimigos.length < TETO_INIMIGOS && agora - ultimoReforco > 1500) {
                ultimoReforco = agora;

                // 1. Sorteio de qual nave vai nascer
                const sorteio = Math.random();
                let matriz, pontos;
                
                if (sorteio > 0.8) { 
                    matriz = catalogoNaves.Boss; pontos = 400; 
                } else if (sorteio > 0.4) { 
                    matriz = catalogoNaves.Goei; pontos = 160; 
                } else { 
                    matriz = catalogoNaves.Zako; pontos = 80; 
                }

                // 2. Fabricar o novo inimigo usando a nossa fábrica otimizada
                const novoInimigo = fabricarInimigo(matriz, pontos);

                // 3. Posicionar no topo, bem fora do ecrã, numa posição X aleatória
                novoInimigo.position.x = naveJogador.position.x + ((Math.random() - 0.5) * 40);
                novoInimigo.position.y = naveJogador.position.y + 60; // Nasce lá no alto

                // 4. Alterar a Máquina de Estados: Em vez de parar na frota, entra em modo Kamikaze
                novoInimigo.userData.estado = 'ATACANDO';
                novoInimigo.userData.tempoMergulho = 0;
                
                const direcaoAoJogador = naveJogador.position.x > novoInimigo.position.x ? 1 : -1;
                novoInimigo.userData.curvaX = direcaoAoJogador * 0.15; 

                // 5. Adicionar diretamente ao mundo e à lista de alvos
                scene.add(novoInimigo);
                arrayInimigos.push(novoInimigo);
            }
        }

        // --- SISTEMA DE INPUTS ---
        function onKeyDown(event) {
            if (event.key === 'Control') {
                cameraAtiva = (cameraAtiva === cameraPerspetiva) ? cameraOrtografica : cameraPerspetiva;
            }
            if (event.code === 'Tab') {
                event.preventDefault(); 
                hudVisivel = !hudVisivel; 
                document.getElementById('hud').style.display = hudVisivel ? 'block' : 'none';
            }

            if (event.code === 'ArrowLeft') teclas.ArrowLeft = true;
            if (event.code === 'ArrowRight') teclas.ArrowRight = true;
            if (event.code === 'ArrowUp') teclas.ArrowUp = true;
            if (event.code === 'ArrowDown') teclas.ArrowDown = true;
            if (event.code === 'KeyZ') disparar();
        }

        function onKeyUp(event) {
            if (event.code === 'ArrowLeft') teclas.ArrowLeft = false;
            if (event.code === 'ArrowRight') teclas.ArrowRight = false;
            if (event.code === 'ArrowUp') teclas.ArrowUp = false;
            if (event.code === 'ArrowDown') teclas.ArrowDown = false;
        }

        function onWindowResize() {
            const aspeto = window.innerWidth / window.innerHeight;
            
            cameraPerspetiva.aspect = aspeto;
            cameraPerspetiva.updateProjectionMatrix();

            const frustumSize = 85;
            cameraOrtografica.left = - (frustumSize * aspeto) / 2;
            cameraOrtografica.right = (frustumSize * aspeto) / 2;
            cameraOrtografica.top = frustumSize / 2;
            cameraOrtografica.bottom = - frustumSize / 2;
            cameraOrtografica.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- MOTOR PRINCIPAL ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Câmaras (Chase Cam)
            const angulo = naveJogador.rotation.z; 
            if (cameraAtiva === cameraPerspetiva) {
                cameraPerspetiva.position.x = naveJogador.position.x + Math.sin(angulo) * 30;
                cameraPerspetiva.position.y = naveJogador.position.y - Math.cos(angulo) * 30;
                cameraPerspetiva.position.z = 20;
                cameraPerspetiva.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
            } else {
                cameraOrtografica.position.x = naveJogador.position.x;
                cameraOrtografica.position.y = naveJogador.position.y;
                cameraOrtografica.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
            }
            controls.target.copy(naveJogador.position);
            controls.update();

            // 2. Movimento da Nave
            const velocidadeRotacao = 0.05;
            const velocidadeMovimento = 0.4;
            if (teclas.ArrowLeft) naveJogador.rotation.z += velocidadeRotacao;
            if (teclas.ArrowRight) naveJogador.rotation.z -= velocidadeRotacao;
            if (teclas.ArrowUp) {
                naveJogador.position.x -= Math.sin(naveJogador.rotation.z) * velocidadeMovimento;
                naveJogador.position.y += Math.cos(naveJogador.rotation.z) * velocidadeMovimento;
            }
            if (teclas.ArrowDown) {
                naveJogador.position.x += Math.sin(naveJogador.rotation.z) * (velocidadeMovimento / 2); 
                naveJogador.position.y -= Math.cos(naveJogador.rotation.z) * (velocidadeMovimento / 2);
            }

            // 3. IA Kamikaze e Movimento dos Inimigos
            gerirAtaques();
            gerirReforcos();
            for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                let inimigo = arrayInimigos[j];
                if (inimigo.userData.estado === 'ATACANDO') {
                    
                    // Velocidade de mergulho
                    inimigo.position.y -= 0.4; 
                    
                    // IA DE PERSEGUIÇÃO: O inimigo descobre onde o jogador está e vira para lá
                    const distanciaX = naveJogador.position.x - inimigo.position.x;
                    inimigo.position.x += distanciaX * 0.02; // O 0.02 é a agressividade da curva

                    // Roda a nave para inclinar no sentido da curva
                    inimigo.rotation.z = -distanciaX * 0.05;

                    // Se falhar o alvo e passar do ecrã, é apagado (O Diretor cria reforços depois)
                    if (inimigo.position.y < naveJogador.position.y - 30) {
                        inimigo.parent.remove(inimigo);
                        arrayInimigos.splice(j, 1);
                        continue;
                    }
                }
            }
           
            // Animação geral da frota base
            if (grupoFrota) {
                const tempo = Date.now() * 0.001; 
                grupoFrota.position.x = Math.sin(tempo) * 4; 
                grupoFrota.position.y = 26 + Math.cos(tempo * 2) * 0.5; 
            }

            // --- LÓGICA DE COLISÃO: INIMIGO BATE NO JOGADOR ---
            if (!invulneravel) {
                const vetorMundoInimigo = new THREE.Vector3();
                
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inimigo = arrayInimigos[j];
                    inimigo.getWorldPosition(vetorMundoInimigo);

                    // Se a distância entre o centro do inimigo e a tua nave for menor que 3 unidades
                    if (naveJogador.position.distanceTo(vetorMundoInimigo) < 3.0) {
                        
                        vidas--;          // Perde uma vida
                        atualizarHUD();   // Atualiza o ecrã
                        
                        // O inimigo que te bateu explode em pedaços e morre
                        criarExplosao(vetorMundoInimigo);
                        inimigo.parent.remove(inimigo);
                        arrayInimigos.splice(j, 1);

                        if (vidas <= 0) {
                            // GAME OVER - Reinicia o jogo por agora
                            alert("GAME OVER! A tua pontuação: " + pontos);
                            location.reload(); 
                        } else {
                            // Ativa o escudo temporário de 2 segundos
                            invulneravel = true;
                            tempoInvulneravel = Date.now();
                        }
                        break; // Bateu num, não precisa de calcular os outros neste frame
                    }
                }
            }

            // 4. Colisão Tiros Jogador vs Inimigos (COM A BOLHA DINÂMICA)
            const vecInim = new THREE.Vector3();
            for (let i = lasers.length - 1; i >= 0; i--) {
                let laser = lasers[i];
                laser.position.x += laser.userData.velX; 
                laser.position.y += laser.userData.velY;
                
                let destruido = false; // AQUI ESTÁ A DEFINIÇÃO QUE FALTAVA!
                
                // 1º Passo: Verifica se o tiro bateu num inimigo
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inim = arrayInimigos[j];
                    inim.getWorldPosition(vecInim);
                    
                    if (laser.position.distanceTo(vecInim) < 2.5) {
                        criarExplosao(vecInim);
                        inim.parent.remove(inim); arrayInimigos.splice(j, 1);
                        pontos += inim.userData.pontos; atualizarHUD();
                        
                        laser.geometry.dispose(); laser.material.dispose(); scene.remove(laser); lasers.splice(i, 1);
                        destruido = true; // O tiro fez o seu trabalho
                        break;
                    }
                }

                // 2º Passo: O GARBAGE COLLECTOR (A Bolha Dinâmica)
                // Se o tiro não bateu em nada (!destruido), verifica se já foi para muito longe da nave
                if (!destruido) {
                    const distX = Math.abs(laser.position.x - naveJogador.position.x);
                    const distY = Math.abs(laser.position.y - naveJogador.position.y);
                    
                    if (distX > 60 || distY > 60) {
                        laser.geometry.dispose(); 
                        laser.material.dispose(); 
                        scene.remove(laser); 
                        lasers.splice(i, 1);
                    }
                }
            }
            

            // 5. Animação de Explosões
            for (let i = explosoes.length - 1; i >= 0; i--) {
                let exp = explosoes[i];
                exp.children.forEach(fragmento => {
                    fragmento.position.x += fragmento.userData.velX;
                    fragmento.position.y += fragmento.userData.velY;
                    fragmento.scale.multiplyScalar(0.85); 
                });
                exp.userData.tempoVida--;

                if (exp.userData.tempoVida <= 0) {
                    exp.children.forEach(fragmento => {
                        fragmento.geometry.dispose();
                        fragmento.material.dispose();
                    });
                    scene.remove(exp);
                    explosoes.splice(i, 1);
                }
            }
             // --- GESTOR DE INVULNERABILIDADE (PISCAR A NAVE) ---
            if (invulneravel) {
                const agora = Date.now();
                // A matemática do Resto (%) faz a nave ficar visível/invisível a cada 100 milissegundos
                naveJogador.visible = Math.floor(agora / 100) % 2 === 0;
                
                // Passados 2 segundos (2000 ms), o escudo desliga e a nave volta a ser física
                if (agora - tempoInvulneravel > 2000) {
                    invulneravel = false;
                    naveJogador.visible = true; // Garante que não fica invisível presa
                }
            }
            renderer.render(scene, cameraAtiva);
        }
    </script>
