<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Galaga 3D - Edição Final (Radar Integrado)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        
        /* Interface de Jogo */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-align: center;
            display: block; /* Mudei para block para estar sempre visivel */
            pointer-events: none; 
            z-index: 10;
        }
        .hud-container { display: flex; justify-content: space-around; padding-top: 20px; }
        .titulo { color: red; font-size: 24px; }
        .valor { color: white; font-size: 24px; }
        .barra-container {
            width: 150px; height: 15px; 
            background-color: #333; 
            border: 2px solid white; 
            margin: 5px auto 0 auto;
        }
        #barra-escudo {
            width: 100%; height: 100%; 
            background-color: #00ffff; 
            transition: width 0.1s;
        }
        
        #ecra-gameover {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85); 
            display: none; flex-direction: column; 
            align-items: center; justify-content: flex-start;
            padding-top: 15vh; font-family: 'Courier New', Courier, monospace; 
            z-index: 999999; pointer-events: auto;
        }
        #texto-pontuacao { color: white; font-size: 40px; font-weight: bold; margin: 0; }
        #texto-gameover { 
            color: #ff0000; font-size: 180px; 
            margin-top: auto; margin-bottom: 10vh;
            text-shadow: 0 0 30px #ff0000; letter-spacing: 15px; 
        }
        .piscar { animation: blink 1s infinite; color: #ffff00 !important; font-size: 35px; margin-top: 30px; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="hud">
        <div class="hud-container">
            <div><div class="titulo">1UP</div><div id="pontuacao" class="valor">0</div></div>
            <div><div class="titulo">HIGH SCORE</div><div id="highscore" class="valor">20000</div></div>
            <div><div class="titulo">VIDAS</div><div id="vidas" class="valor">3</div></div>
            <div>
                <div class="titulo">ESCUDO (W)</div>
                <div class="barra-container"><div id="barra-escudo"></div></div>
            </div>
        </div>
    </div>

    <div id="ecra-gameover">
        <p id="texto-pontuacao">PONTUAÇÃO: <span id="pontuacao-final">0</span></p>
        <p class="piscar">INSERT COIN (Pressiona ENTER)</p>
        <h1 id="texto-gameover">GAME OVER</h1>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- VARIÁVEIS GLOBAIS ---
        let scene, renderer, controls;
        let cameraPerspetiva, cameraOrtografica, cameraAtiva;
        let naveJogador;
        
        let lasers = []; 
        let arrayInimigos = [];
        let explosoes = [];
        let particulasRasto = [];

        let teclas = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
        let ultimoAtaqueInimigo = 0;
        
        let pontos = 0;
        let pontuacaoMaxima = 20000;
        let vidas = 3;
        let hudVisivel = true;
        
        const TETO_INIMIGOS = 30; 
        let ultimoReforco = 0;    
        let catalogoNaves = {};   

        let invulneravel = false;
        let tempoInvulneravel = 0;
        let proximoBonusVida = 10000; 

        let visualBlocos = new THREE.Group();
        let visual3D = new THREE.Group();
        let jogoAcabou = false;

        // Geometrias Otimizadas
        const geoLaserGlobal = new THREE.CylinderGeometry(0.15, 0.15, 2.0);
        const matLaserGlobal = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const geoExplosaoGlobal = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const materiaisExplosaoGlobais = [
            new THREE.MeshBasicMaterial({ color: 0xffff00 }),
            new THREE.MeshBasicMaterial({ color: 0x00ffff }),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        ];
        const geoRastoGlobal = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const matRastoGlobal = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });

        // --- AQUI ESTÁ A GEOMETRIA DA SETA (RADAR) QUE FALTAVA ---
        const formaSeta = new THREE.Shape();
        formaSeta.moveTo(0, 1.5);
        formaSeta.lineTo(1, -0.5);
        formaSeta.lineTo(-1, -0.5);
        formaSeta.lineTo(0, 1.5);
        const geoSetaGlobal = new THREE.ShapeGeometry(formaSeta);

        const vetorMundoInimigo = new THREE.Vector3();
        const vecInim = new THREE.Vector3();

        let malhaEscudo;
        let escudoAtivo = false;
        let tempoFimEscudo = 0;       
        let cargaEscudo = 100;        
        let ultimaAtualizacaoEscudo = Date.now();
        let fundoEstrelas;

        let filaElite = ['Boss', 'Tanque', 'Tanque', 'Tanque', 'PortaAvioes', 'PortaAvioes', 'Kamikaze', 'Kamikaze', 'Caca', 'Caca', 'Caca', 'Caca', 'Caca'];

        init();
        animate();

        function init() {
            // MATERIAIS GLOBAIS
            const cB = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const cV = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const cA = new THREE.MeshStandardMaterial({ color: 0x0055ff });
            const cVerde = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
            const cCiano = new THREE.MeshStandardMaterial({ color: 0x00ffff });
            const cAmarelo = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            const cRoxo = new THREE.MeshStandardMaterial({ color: 0xaa00ff });
            const cLaranja = new THREE.MeshStandardMaterial({ color: 0xff8800 });

            catalogoNaves = {
                Kamikaze: [[0, 3, cV], [-1, 2, cV], [1, 2, cV], [0, 1, cB], [-1, 0, cAmarelo], [1, 0, cAmarelo]],
                Caca: [[-2, 1, cCiano], [2, 1, cCiano], [-1, 0, cB], [0, 0, cA], [1, 0, cB]],
                Tanque: [[-3, 2, cCiano], [3, 2, cCiano], [-2, 1, cVerde], [2, 1, cVerde], [0, 0, cV]],
                PortaAvioes: [[-4, 1, cRoxo], [4, 1, cRoxo], [0, 0, cLaranja], [-2, -1, cB], [2, -1, cB]],
                Boss: [[0, 4, cV], [-2, 2, cLaranja], [2, 2, cLaranja], [0, 1, cB], [-3, 0, cRoxo], [3, 0, cRoxo]]
            };

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205); 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            configurarCamaras();
            configurarLuzes();
            criarFundo();
            criarNave();

            controls = new OrbitControls(cameraPerspetiva, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = false;
            controls.minDistance = 10;
            controls.maxDistance = 60;

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
        }

        function atualizarHUD() {
            if (pontos > pontuacaoMaxima) pontuacaoMaxima = pontos;
            if (pontos >= proximoBonusVida) {
                vidas++;
                proximoBonusVida += 10000; 
            }
            document.getElementById('pontuacao').innerText = pontos;
            document.getElementById('highscore').innerText = pontuacaoMaxima;
            document.getElementById('vidas').innerText = vidas;
        }

        function configurarCamaras() {
            const aspeto = window.innerWidth / window.innerHeight;
            cameraPerspetiva = new THREE.PerspectiveCamera(45, aspeto, 0.1, 1000);
            cameraPerspetiva.position.set(0, -32, 18); 
            
            const frustumSize = 85; 
            cameraOrtografica = new THREE.OrthographicCamera((frustumSize * aspeto) / -2, (frustumSize * aspeto) / 2, frustumSize / 2, frustumSize / -2, 0.1, 1000);
            cameraOrtografica.position.set(0, 5, 25); 
            cameraAtiva = cameraOrtografica; 
        }

        function configurarLuzes() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const luzDirecional = new THREE.DirectionalLight(0xffffff, 1.2);
            luzDirecional.position.set(0, 20, 10);
            scene.add(luzDirecional);
        }       

        function criarNave() {
            naveJogador = new THREE.Group();
            visualBlocos = new THREE.Group();

            // 1. Materiais com Emissive (Brilho original)
            const geometria = new THREE.BoxGeometry(1, 1, 1);
            const cB = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 });
            const cV = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 });
            const cA = new THREE.MeshStandardMaterial({ color: 0x0055ff, emissive: 0x001155 });
            const cCiano = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444 });

            // 2. O teu Design Original Gigante (50+ blocos)
            const designNave = [
                [0, 10, cA], [0, 9, cA], [0, 8, cA], [0, 7, cA], [0, 6, cB],
                [-1, 8, cB], [1, 8, cB], [-1, 7, cB], [1, 7, cB], [-1, 6, cB], [1, 6, cB], [-2, 6, cB], [2, 6, cB],
                [-3, 6, cCiano], [3, 6, cCiano], [-4, 6, cCiano], [4, 6, cCiano],
                [-3, 5, cB], [3, 5, cB], [-4, 5, cB], [4, 5, cB],
                [-5, 5, cCiano], [5, 5, cCiano], [-6, 5, cCiano], [6, 5, cCiano],
                [-7, 4, cCiano], [7, 4, cCiano], [-8, 4, cCiano], [8, 4, cCiano],
                [-7, 3, cB], [7, 3, cB], [-8, 3, cB], [8, 3, cB],
                [-9, 3, cV], [9, 3, cV], [-10, 2, cV], [10, 2, cV],
                [-2, 3, cV], [2, 3, cV], [-2, 2, cV], [2, 2, cV],
                [-1, 1, cA], [1, 1, cA], [-1, 0, cV], [1, 0, cV],
                [-2, 0, cA], [2, 0, cA], [-3, -1, cV], [3, -1, cV]
            ];

            // 3. Montagem
            designNave.forEach(bloco => {
                const cubo = new THREE.Mesh(geometria, bloco[2]);
                cubo.position.set(bloco[0], bloco[1], 0);
                visualBlocos.add(cubo);
            });
            
            visualBlocos.scale.set(0.4, 0.4, 0.4); // A tua escala original
            naveJogador.add(visualBlocos);

            // 4. Modelo 3D (Mantido para quando clicas CTRL)
            visual3D = new THREE.Group();
            const loader = new GLTFLoader();
            loader.load('galaga_ship.glb', (gltf) => {
                const modelo = gltf.scene;
                modelo.scale.set(0.5, 0.5, 0.5); 
                modelo.rotation.x = Math.PI / 2;
                modelo.rotation.y = -Math.PI / 2; 
                visual3D.add(modelo);
            });
            visual3D.visible = false;
            naveJogador.add(visual3D);

            // 5. Efeitos da Nave (Luz e Escudo)
            const luzPonto = new THREE.PointLight(0x0055ff, 5, 20);
            luzPonto.position.set(0, -2, 0); 
            naveJogador.add(luzPonto); 

            const geoEscudo = new THREE.IcosahedronGeometry(3.5, 1);
            malhaEscudo = new THREE.Mesh(geoEscudo, new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.6 }));
            malhaEscudo.visible = false;
            naveJogador.add(malhaEscudo);

            naveJogador.position.y = -20;
            scene.add(naveJogador);
        }
        
        function fabricarInimigo(tipoDaNave, valorPontos) {
            const matriz = catalogoNaves[tipoDaNave];
            if (!matriz) return new THREE.Group();

            const contentor = new THREE.Group();
            const geometria = new THREE.BoxGeometry(1, 1, 1);

            matriz.forEach(bloco => {
                const cubo = new THREE.Mesh(geometria, bloco[2]);
                cubo.position.set(bloco[0], bloco[1], 0);
                contentor.add(cubo);
            });
            contentor.scale.set(0.35, 0.35, 0.35);

            // --- AQUI ESTÁ A ATRIBUIÇÃO DA SETA AO INIMIGO ---
            const matSeta = new THREE.MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0 });
            const seta = new THREE.Mesh(geoSetaGlobal, matSeta);
            seta.renderOrder = 999; 
            scene.add(seta);

            contentor.userData = {
                tipo: tipoDaNave,
                pontos: valorPontos,
                estado: 'ATACANDO',
                vida: (tipoDaNave === 'Boss') ? 10 : (tipoDaNave === 'Tanque' ? 3 : 1),
                setaGui: seta // Guarda a seta ligada a este inimigo
            };

            return contentor;
        }

        function gerirReforcos() {
            if (jogoAcabou) return;
            if (arrayInimigos.length < TETO_INIMIGOS) {
                let tipo, pts;
                if (filaElite.length > 0) {
                    tipo = filaElite.shift(); 
                    pts = (tipo === 'Boss') ? 400 : (tipo === 'PortaAvioes' ? 200 : 100);
                } else {
                    const sorteio = Math.random();
                    if (sorteio > 0.9) { tipo = 'PortaAvioes'; pts = 200; }
                    else if (sorteio > 0.7) { tipo = 'Tanque'; pts = 150; }
                    else if (sorteio > 0.4) { tipo = 'Kamikaze'; pts = 100; }
                    else { tipo = 'Caca'; pts = 50; }
                }

                const novoInimigo = fabricarInimigo(tipo, pts);
                const ladoSorteado = Math.floor(Math.random() * 3); 
                
                if (ladoSorteado === 0) {
                    novoInimigo.position.x = (Math.random() - 0.5) * 100;
                    novoInimigo.position.y = naveJogador.position.y + 60;
                } else if (ladoSorteado === 1) {
                    novoInimigo.position.x = -60;
                    novoInimigo.position.y = naveJogador.position.y + (Math.random() * 40);
                } else {
                    novoInimigo.position.x = 60;
                    novoInimigo.position.y = naveJogador.position.y + (Math.random() * 40);
                }
                scene.add(novoInimigo);
                arrayInimigos.push(novoInimigo);
            }
        }

        function disparar() {
            const angulo = naveJogador.rotation.z;
            const dirX = -Math.sin(angulo);
            const dirY = Math.cos(angulo);
            const latX = Math.cos(angulo);
            const latY = Math.sin(angulo);
            
            const vTiro = 1.2, env = 1.4, proj = 2.5;    

            const laserEsq = new THREE.Mesh(geoLaserGlobal, matLaserGlobal);
            laserEsq.position.set(naveJogador.position.x - (latX*env) + (dirX*proj), naveJogador.position.y - (latY*env) + (dirY*proj), 0);
            laserEsq.rotation.z = angulo;
            laserEsq.userData = {velX: dirX*vTiro, velY: dirY*vTiro};
            scene.add(laserEsq); lasers.push(laserEsq);

            const laserDir = new THREE.Mesh(geoLaserGlobal, matLaserGlobal);
            laserDir.position.set(naveJogador.position.x + (latX*env) + (dirX*proj), naveJogador.position.y + (latY*env) + (dirY*proj), 0);
            laserDir.rotation.z = angulo;
            laserDir.userData = {velX: dirX*vTiro, velY: dirY*vTiro};
            scene.add(laserDir); lasers.push(laserDir);
        }

        function criarExplosao(posicaoMundo) {
            const grupoExplosao = new THREE.Group();
            grupoExplosao.position.copy(posicaoMundo); 
            for (let i = 0; i < 8; i++) {
                const fragmento = new THREE.Mesh(geoExplosaoGlobal, materiaisExplosaoGlobais[Math.floor(Math.random() * materiaisExplosaoGlobais.length)]);
                const ang = (i / 8) * Math.PI * 2;
                fragmento.userData = {velX: Math.cos(ang) * 0.6, velY: Math.sin(ang) * 0.6};
                grupoExplosao.add(fragmento);
            }
            grupoExplosao.userData.tempoVida = 20; 
            scene.add(grupoExplosao);
            explosoes.push(grupoExplosao);
        }

        function gerirAtaques() { } // Função vazia já que todos atacam no modo sobrevivência

        function onKeyDown(event) {
            if (jogoAcabou) {
                if (event.code === 'Enter') location.reload(); return; 
            }
            if (event.key === 'Control') cameraAtiva = (cameraAtiva === cameraPerspetiva) ? cameraOrtografica : cameraPerspetiva;
            if (event.code === 'Tab') {
                event.preventDefault(); 
                hudVisivel = !hudVisivel; 
                document.getElementById('hud').style.display = hudVisivel ? 'block' : 'none';
            }
            if (event.code === 'ArrowLeft') teclas.ArrowLeft = true;
            if (event.code === 'ArrowRight') teclas.ArrowRight = true;
            if (event.code === 'ArrowUp') teclas.ArrowUp = true;
            if (event.code === 'ArrowDown') teclas.ArrowDown = true;
            if (event.code === 'KeyZ') disparar();
            if (event.code === 'KeyW' && cargaEscudo >= 100 && !escudoAtivo) {
                escudoAtivo = true; malhaEscudo.visible = true; tempoFimEscudo = Date.now() + 5000;
            }
        }
        function onKeyUp(event) {
            if (event.code === 'ArrowLeft') teclas.ArrowLeft = false;
            if (event.code === 'ArrowRight') teclas.ArrowRight = false;
            if (event.code === 'ArrowUp') teclas.ArrowUp = false;
            if (event.code === 'ArrowDown') teclas.ArrowDown = false;
        }

        function onWindowResize() {
            const aspeto = window.innerWidth / window.innerHeight;
            cameraPerspetiva.aspect = aspeto; cameraPerspetiva.updateProjectionMatrix();
            const fS = 85;
            cameraOrtografica.left = -(fS*aspeto)/2; cameraOrtografica.right = (fS*aspeto)/2;
            cameraOrtografica.top = fS/2; cameraOrtografica.bottom = -fS/2; cameraOrtografica.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function criarTexturaEstrela() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'white'); grad.addColorStop(0.2, 'rgba(200, 220, 255, 0.8)'); grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        }

        function criarFundo() {
            const geo = new THREE.BufferGeometry(); 
            const pos = new Float32Array(1500 * 3); 
            for(let i = 0; i < 4500; i += 3) {
                pos[i] = (Math.random() - 0.5) * 300;     
                pos[i+1] = (Math.random() - 0.5) * 300;   
                pos[i+2] = (Math.random() - 0.5) * 40 - 60; 
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            fundoEstrelas = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, map: criarTexturaEstrela(), transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
            scene.add(fundoEstrelas);
        }

        // --- MOTOR PRINCIPAL OTIMIZADO ---
        function animate() {
            if (jogoAcabou) {
                renderer.render(scene, cameraAtiva);
                return; 
            }

            requestAnimationFrame(animate);

            const angulo = naveJogador.rotation.z; 
            if (cameraAtiva === cameraPerspetiva) {
                cameraPerspetiva.position.x = naveJogador.position.x + Math.sin(angulo) * 30;
                cameraPerspetiva.position.y = naveJogador.position.y - Math.cos(angulo) * 30;
                cameraPerspetiva.position.z = 20;
                cameraPerspetiva.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
            } else {
                cameraOrtografica.position.x = naveJogador.position.x;
                cameraOrtografica.position.y = naveJogador.position.y;
                cameraOrtografica.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
            }
            controls.target.copy(naveJogador.position);
            controls.update();

            const vRot = 0.05, vMov = 0.4;
            if (teclas.ArrowLeft) naveJogador.rotation.z += vRot;
            if (teclas.ArrowRight) naveJogador.rotation.z -= vRot;
            if (teclas.ArrowUp) {
                naveJogador.position.x -= Math.sin(naveJogador.rotation.z) * vMov;
                naveJogador.position.y += Math.cos(naveJogador.rotation.z) * vMov;
            }
            if (teclas.ArrowDown) {
                naveJogador.position.x += Math.sin(naveJogador.rotation.z) * (vMov / 2); 
                naveJogador.position.y -= Math.cos(naveJogador.rotation.z) * (vMov / 2);
            }

            gerirReforcos();

            // --- MOVIMENTO DOS INIMIGOS E SISTEMA DE RADAR ---
            for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                let inim = arrayInimigos[j]; 
                
                if (inim && inim.userData.estado === 'ATACANDO') {
                    // IA Perseguição
                    if (inim.position.y > naveJogador.position.y) inim.position.y -= 0.25;
                    else inim.position.y += 0.25;
                    const diffX = naveJogador.position.x - inim.position.x;
                    inim.position.x += diffX * 0.01; 
                    inim.rotation.z = -diffX * 0.05;

                    // --- LÓGICA DA SETA (RADAR) ---
                    let seta = inim.userData.setaGui;
                    if (seta) {
                        if (cameraAtiva === cameraPerspetiva) {
                            const dirSeta = new THREE.Vector3().subVectors(inim.position, naveJogador.position);
                            const dist = dirSeta.length();
                            dirSeta.normalize();
                            
                            // Posiciona a 8 unidades da nave para não tapar o modelo 3D
                            seta.position.copy(naveJogador.position).add(dirSeta.multiplyScalar(8));
                            seta.rotation.z = Math.atan2(dirSeta.y, dirSeta.x) - Math.PI / 2;
                            
                            let alpha = 1.0 - (dist / 120);
                            seta.material.opacity = THREE.MathUtils.clamp(alpha, 0.0, 0.8);
                            seta.visible = true;
                        } else {
                            seta.visible = false;
                        }
                    }

                    // Limpeza se a nave sair muito do ecrã
                    if (Math.abs(inim.position.y - naveJogador.position.y) > 80) {
                        scene.remove(inim);
                        if (inim.userData.setaGui) {
                            scene.remove(inim.userData.setaGui);
                            inim.userData.setaGui.material.dispose();
                        }
                        arrayInimigos.splice(j, 1);
                    }
                }
            }

            // OTIMIZAÇÃO DE COLISÕES
            if (!invulneravel) {
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inimigo = arrayInimigos[j];
                    inimigo.getWorldPosition(vetorMundoInimigo);

                    if (naveJogador.position.distanceToSquared(vetorMundoInimigo) < 9.0) {
                        if (escudoAtivo) {
                            criarExplosao(vetorMundoInimigo);
                            pontos += inimigo.userData.pontos;
                            inimigo.parent.remove(inimigo);
                            if (inimigo.userData.setaGui) {
                                scene.remove(inimigo.userData.setaGui);
                                inimigo.userData.setaGui.material.dispose();
                            }
                            arrayInimigos.splice(j, 1);
                            atualizarHUD();
                        } else {
                            vidas--;          
                            atualizarHUD();   
                            criarExplosao(vetorMundoInimigo);
                            inimigo.parent.remove(inimigo);
                            if (inimigo.userData.setaGui) {
                                scene.remove(inimigo.userData.setaGui);
                                inimigo.userData.setaGui.material.dispose();
                            }
                            arrayInimigos.splice(j, 1);

                           if (vidas <= 0) {
                                document.getElementById('vidas').innerText = "0"; 
                                document.getElementById('pontuacao-final').innerText = pontos;
                                document.getElementById('ecra-gameover').style.display = 'flex';
                                jogoAcabou = true;
                            } else {
                                invulneravel = true;
                                tempoInvulneravel = Date.now();
                            }
                        }
                        break; 
                    }
                }
            }

            // COLISÃO DOS LASERS
            for (let i = lasers.length - 1; i >= 0; i--) {
                let laser = lasers[i];
                laser.position.x += laser.userData.velX; 
                laser.position.y += laser.userData.velY;
                
                let destruido = false; 
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inim = arrayInimigos[j];
                    inim.getWorldPosition(vecInim);
                    
                    if (laser.position.distanceToSquared(vecInim) < 6.25) {
                        criarExplosao(vecInim);
                        inim.parent.remove(inim); 
                        if (inim.userData.setaGui) {
                            scene.remove(inim.userData.setaGui);
                            inim.userData.setaGui.material.dispose();
                        }
                        arrayInimigos.splice(j, 1);
                        pontos += inim.userData.pontos; atualizarHUD();
                        scene.remove(laser); lasers.splice(i, 1);
                        destruido = true; 
                        break;
                    }
                }

                if (!destruido) {
                    const distX = Math.abs(laser.position.x - naveJogador.position.x);
                    const distY = Math.abs(laser.position.y - naveJogador.position.y);
                    if (distX > 60 || distY > 60) {
                        scene.remove(laser); 
                        lasers.splice(i, 1);
                    }
                }
            }
            
            // FÍSICA DAS EXPLOSÕES
            for (let i = explosoes.length - 1; i >= 0; i--) {
                let exp = explosoes[i];
                exp.children.forEach(fragmento => {
                    fragmento.position.x += fragmento.userData.velX;
                    fragmento.position.y += fragmento.userData.velY;
                    fragmento.scale.multiplyScalar(0.85); 
                });
                exp.userData.tempoVida--;
                if (exp.userData.tempoVida <= 0) { scene.remove(exp); explosoes.splice(i, 1); }
            }
            
            // INVULNERABILIDADE VISUAL
            if (invulneravel) {
                const agora = Date.now();
                naveJogador.visible = Math.floor(agora / 100) % 2 === 0;
                if (agora - tempoInvulneravel > 2000) {
                    invulneravel = false; naveJogador.visible = true; 
                }
            }

            // GESTÃO DE VISUALIZAÇÃO 2D/3D
            const modo3DAtivo = (cameraAtiva === cameraPerspetiva);
            visualBlocos.visible = !modo3DAtivo;
            visual3D.visible = modo3DAtivo;
            arrayInimigos.forEach(inimigo => {
                if (inimigo.userData.visualBlocos && inimigo.userData.visual3D) {
                    inimigo.userData.visualBlocos.visible = !modo3DAtivo;
                    inimigo.userData.visual3D.visible = modo3DAtivo;
                }
            });

            // RASTO DA NAVE
            const agora = Date.now();
            if (teclas.ArrowUp) {
                const particula = new THREE.Mesh(geoRastoGlobal, matRastoGlobal);
                const recuo = 2.0; 
                particula.position.x = naveJogador.position.x + Math.sin(naveJogador.rotation.z) * recuo;
                particula.position.y = naveJogador.position.y - Math.cos(naveJogador.rotation.z) * recuo;
                scene.add(particula);
                particulasRasto.push({ malha: particula, tempoVida: 1.0 });
            }

            for (let i = particulasRasto.length - 1; i >= 0; i--) {
                let p = particulasRasto[i];
                p.malha.position.y -= 0.2; p.malha.scale.multiplyScalar(0.85); p.tempoVida -= 0.05; 
                if (p.tempoVida <= 0) { scene.remove(p.malha); particulasRasto.splice(i, 1); }
            }

            // ESCUDO E HUD
            if (escudoAtivo) {
                malhaEscudo.rotation.x += 0.05; malhaEscudo.rotation.y += 0.05; malhaEscudo.rotation.z += 0.02;
                if (agora > tempoFimEscudo) { escudoAtivo = false; malhaEscudo.visible = false; cargaEscudo = 0; }
            } else {
                if (cargaEscudo < 100) {
                    cargaEscudo += (agora - ultimaAtualizacaoEscudo) * (100 / 60000); 
                    if (cargaEscudo > 100) cargaEscudo = 100;
                }
            }
            ultimaAtualizacaoEscudo = agora;

            if (hudVisivel) {
                const elementoBarra = document.getElementById('barra-escudo');
                elementoBarra.style.width = Math.floor(cargaEscudo) + '%';
                elementoBarra.style.backgroundColor = cargaEscudo >= 100 ? '#00ffff' : '#ffaa00';
            }

            // FUNDO MÓVEL
            if (fundoEstrelas) {
                const posicoes = fundoEstrelas.geometry.attributes.position.array;
                for(let i = 0; i < posicoes.length; i += 3) { 
                    posicoes[i+1] -= 0.5; 
                    if (teclas.ArrowUp) posicoes[i+1] -= 1.0; 
                    if (posicoes[i+1] < -150) posicoes[i+1] = 150;
                }
                fundoEstrelas.geometry.attributes.position.needsUpdate = true; 
            }
            
            renderer.render(scene, cameraAtiva);
        }
    </script>
</body>
</html>
