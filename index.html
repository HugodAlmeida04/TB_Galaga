<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Galaga 3D - Ultimate Revolution</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; user-select: none; }
        canvas { display: block; }
        
        /* ===== HUD ===== */
        #hud {
            position: absolute; top: 50px; left: 0; width: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-align: center;
            display: none; pointer-events: none; z-index: 10;
        }
        .hud-container { display: flex; justify-content: space-around; padding-top: 20px; }
        .titulo { color: red; font-size: 24px; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .valor { color: white; font-size: 24px; }
        .barra-container {
            width: 150px; height: 15px; background-color: #333; 
            border: 2px solid white; margin: 5px auto 0 auto;
        }
        #barra-escudo { width: 100%; height: 100%; background-color: #00ffff; }
        #barra-onda { width: 100%; height: 100%; background-color: #ff00ff; }
        #barra-dash { width: 100%; height: 100%; background-color: #ffff00; }
        
        #ecra-gameover {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85); display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            font-family: 'Courier New', Courier, monospace; z-index: 999999;
        }
        #texto-pontuacao { color: white; font-size: 40px; font-weight: bold; margin: 0; }
        #texto-gameover { 
            color: #ff0000; font-size: 140px; margin: 20px 0; 
            text-shadow: 0 0 30px #ff0000; letter-spacing: 15px; 
        }
        .piscar { animation: blink 1s infinite; color: #ffff00 !important; font-size: 35px; margin-top: 30px; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ===== MENUS DE CANTO EXTERNOS ===== */
        .canto-topo-esq { position: absolute; top: 20px; left: 20px; z-index: 300; display: flex; gap: 10px; }
        .canto-topo-dir { position: absolute; top: 20px; right: 20px; z-index: 300; display: flex; gap: 15px; }
        
        .btn-persp {
            background: rgba(0,0,0,0.6); border: 2px solid #555; color: #aaa;
            padding: 8px 16px; font-family: monospace; font-weight: bold; cursor: pointer;
            border-radius: 4px; transition: all 0.2s;
        }
        .btn-persp.ativo {
            border-color: #00ffff; color: #00ffff;
            box-shadow: 0 0 15px #00ffff, inset 0 0 5px #00ffff;
        }

        .icone-input {
            background: rgba(20,20,40,0.8); border: 1px solid #444; color: #555;
            padding: 8px 12px; font-family: monospace; font-size: 12px; border-radius: 4px;
            font-weight: bold; display: flex; align-items: center; gap: 6px;
            cursor: pointer;
        }
        .icone-input.ativo {
            border-color: #00ff00; color: #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.4);
        }

        /* ===== MENU PRINCIPAL ===== */
        #menu {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 200; background: #000;
        }
        #menu-canvas { position: absolute; inset: 0; z-index: 0; }
        .menu-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        
        .logo-galaga {
            font-size: clamp(48px, 10vw, 96px); font-weight: bold;
            letter-spacing: 12px; color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 30px #f0f, 0 0 60px #f0f;
            animation: pulso 2s ease-in-out infinite; margin-bottom: 8px;
        }
        .logo-sub { font-size: clamp(12px,2vw,18px); color: #ff0; letter-spacing: 6px; margin-bottom: 50px; }
        
        .stack-botoes { display: flex; flex-direction: column; gap: 16px; min-width: 280px; }
        
        .btn-universal {
            background: rgba(10, 10, 30, 0.8); border: 2px solid #4466ff; color: #4466ff;
            font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold;
            letter-spacing: 4px; padding: 14px; border-radius: 6px; cursor: pointer;
            text-transform: uppercase; transition: all 0.2s; text-align: center;
        }
        .btn-universal:hover {
            background: #4466ff; color: #000;
            box-shadow: 0 0 20px #4466ff; transform: scale(1.03);
        }
        #btn-jogar { border-color: #ff0; color: #ff0; }
        #btn-jogar:hover { background: #ff0; color: #000; box-shadow: 0 0 20px #ff0; }
        #btn-quit { border-color: #ff3333; color: #ff3333; }
        #btn-quit:hover { background: #ff3333; color: #000; box-shadow: 0 0 20px #ff3333; }

        /* ===== PAINEL DE DEFINIÇÕES SUB-MENU ===== */
        #painel-definicoes {
            background: rgba(5, 5, 25, 0.95); border: 2px solid #4466ff;
            border-radius: 12px; padding: 24px; width: 550px; display: none;
            flex-direction: column; box-shadow: 0 0 30px rgba(68,102,255,0.3);
        }
        .abas-titulos { display: flex; border-bottom: 2px solid #2244aa; margin-bottom: 20px; }
        .aba-link {
            flex: 1; padding: 10px; text-align: center; color: #88aaff;
            font-family: monospace; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .aba-link.ativa {
            color: #fff; background: #2244aa; border-radius: 6px 6px 0 0;
            text-shadow: 0 0 8px #fff;
        }
        .aba-conteudo { display: none; min-height: 220px; color: #ccc; font-family: monospace; }
        .aba-conteudo.ativa { display: block; }

        /* Estilos Internos das Abas */
        .linha-controlo { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #112255; }
        .btn-captura { background: #222; border: 1px solid #555; color: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; min-width: 120px; text-align: center; }
        .btn-captura.escutando { border-color: #ff0; color: #ff0; box-shadow: 0 0 8px #ff0; }
        
        .btn-lang { background: #222; border: 1px solid #444; color: #aaa; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 6px; }
        .btn-lang.ativo { border-color: #ff0; color: #ff0; box-shadow: 0 0 10px rgba(255,255,0,0.3); }

        .def-linha { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .toggle { position: relative; width: 44px; height: 22px; cursor: pointer; }
        .toggle input { display: none; }
        .toggle-pista { position: absolute; inset: 0; background: #222; border: 1px solid #444; border-radius: 11px; }
        .toggle input:checked ~ .toggle-pista { background: #4466ff; }
        .toggle-bolinha { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: #666; border-radius: 50%; transition: transform .2s; }
        .toggle input:checked ~ .toggle-bolinha { transform: translateX(22px); background: #fff; }
        .vol-slider { -webkit-appearance: none; appearance: none; width: 150px; height: 4px; background: #333; border-radius: 2px; outline: none; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #4466ff; cursor: pointer; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div class="canto-topo-esq">
        <button class="btn-persp" id="bt-2d">2D</button>
        <button class="btn-persp ativo" id="bt-3d">3D</button>
    </div>
    <div class="canto-topo-dir">
        <div class="icone-input ativo" id="icon-teclado">⌨ <span data-i18n="ui.teclado">TECLADO</span></div>
        <div class="icone-input" id="icon-comando">🎮 <span data-i18n="ui.comando">COMANDO</span></div>
    </div>

    <div id="menu">
        <canvas id="menu-canvas"></canvas>
        <div class="menu-content">
            <div class="logo-galaga">GALAGA</div>
            <div class="logo-sub">3D · Ultimate Edition</div>
            
            <div class="stack-botoes" id="menu-botoes-raiz">
                <button class="btn-universal" id="btn-jogar" data-i18n="menu.jogar">▶ Jogar</button>
                <button class="btn-universal" id="btn-definicoes" data-i18n="menu.definicoes">⚙ Definições</button>
                <button class="btn-universal" id="btn-quit" data-i18n="menu.sair">❌ Sair</button>
            </div>

            <div id="painel-definicoes">
                <div class="abas-titulos">
                    <div class="aba-link ativa" data-tab="tab-controlos" data-i18n="tabs.controlos">Controlos</div>
                    <div class="aba-link" data-tab="tab-idioma" data-i18n="tabs.idioma">Idioma</div>
                    <div class="aba-link" data-tab="tab-audio" data-i18n="tabs.audio">Áudio</div>
                </div>

                <div class="aba-conteudo ativa" id="tab-controlos">
                    <div id="lista-mapeamento"></div>
                </div>

                <div class="aba-conteudo" id="tab-idioma">
                    <div style="display:flex; justify-content:center; gap:20px; padding-top:40px;">
                        <button class="btn-lang ativo" id="lang-pt">Português</button>
                        <button class="btn-lang" id="lang-en">English</button>
                    </div>
                </div>

                <div class="aba-conteudo" id="tab-audio">
                    <div class="def-linha">
                        <span data-i18n="audio.som">Efeitos de Som</span>
                        <label class="toggle"><input type="checkbox" id="tog-som" checked><span class="toggle-pista"></span><span class="toggle-bolinha"></span></label>
                    </div>
                    <div class="def-linha">
                        <span data-i18n="audio.volsfx">Volume SFX</span>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="range" class="vol-slider" id="sl-sfx" min="0" max="100" value="70">
                            <span id="vl-sfx">70%</span>
                        </div>
                    </div>
                    <div class="def-linha">
                        <span data-i18n="audio.musica">Música de Fundo</span>
                        <label class="toggle"><input type="checkbox" id="tog-musica" checked><span class="toggle-pista"></span><span class="toggle-bolinha"></span></label>
                    </div>
                    <div class="def-linha">
                        <span data-i18n="audio.volmus">Vol. Música</span>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="range" class="vol-slider" id="sl-musica" min="0" max="100" value="50">
                            <span id="vl-musica">50%</span>
                        </div>
                    </div>
                </div>

                <button class="btn-universal" id="btn-voltar-menu" style="margin-top:20px; font-size:14px; padding:8px; border-color:#88aaff; color:#88aaff;" data-i18n="menu.voltar">Voltar</button>
            </div>
        </div>
    </div>
    
    <div id="hud">
        <div class="hud-container">
            <div><div class="titulo" data-i18n="hud.wave">WAVE</div><div id="wavenumero" class="valor">1</div></div>
            <div><div class="titulo" data-i18n="hud.pontos">1UP</div><div id="pontuacao" class="valor">0</div></div>
            <div><div class="titulo" data-i18n="hud.recorde">HIGH SCORE</div><div id="highscore" class="valor">0</div></div>
            <div><div class="titulo" data-i18n="hud.vidas">VIDAS</div><div id="vidas" class="valor">3</div></div>
            <div>
                <div class="titulo"><span data-i18n="hud.escudo">ESCUDO</span> (<span id="txt-key-escudo">C</span>)</div>
                <div class="barra-container"><div id="barra-escudo"></div></div>
            </div>
            <div>
                <div class="titulo"><span data-i18n="hud.onda">ONDA</span> (<span id="txt-key-onda">X</span>)</div>
                <div class="barra-container"><div id="barra-onda"></div></div>
            </div>
            <div>
                <div class="titulo"><span data-i18n="hud.dash">DASH</span> (<span id="txt-key-dash">SPACE</span>)</div>
                <div class="barra-container"><div id="barra-dash"></div></div>
            </div>
        </div>
    </div>

    <div id="ecra-gameover">
        <p id="texto-pontuacao"><span data-i18n="go.pontos">PONTUAÇÃO</span>: <span id="pontuacao-final">0</span></p>
        <p class="piscar" data-i18n="go.recomecar">INSERT COIN (Pressiona ENTER)</p>
        <h1 id="texto-gameover">GAME OVER</h1>
    </div>

    <script>
    const dicionario = {
        pt: {
            "menu.jogar": "▶ Jogar", "menu.continuar": "▶ Continuar", "menu.definicoes": "⚙ Definições", "menu.sair": "❌ Sair", "menu.voltar": "Voltar",
            "tabs.controlos": "Controlos", "tabs.idioma": "Idioma", "tabs.audio": "Áudio",
            "audio.som": "Efeitos de Som", "audio.volsfx": "Volume SFX", "audio.musica": "Música de Fundo", "audio.volmus": "Vol. Música",
            "hud.wave": "WAVE", "hud.pontos": "1UP", "hud.recorde": "HIGH SCORE", "hud.vidas": "VIDAS", "hud.escudo": "ESCUDO", "hud.onda": "ONDA", "hud.dash": "DASH",
            "go.pontos": "PONTUAÇÃO", "go.recomecar": "INSERT COIN (Pressiona ENTER)",
            "ctrl.ArrowLeft": "Mover Esquerda", "ctrl.ArrowRight": "Mover Direita", "ctrl.ArrowUp": "Acelerar", "ctrl.ArrowDown": "Travar",
            "ctrl.KeyZ": "Disparar", "ctrl.KeyC": "Escudo", "ctrl.KeyX": "Onda Choque", "ctrl.Space": "Dash", "ui.teclado": "TECLADO", "ui.comando": "COMANDO"
        },
        en: {
            "menu.jogar": "▶ Play", "menu.continuar": "▶ Continue", "menu.definicoes": "⚙ Settings", "menu.sair": "❌ Quit", "menu.voltar": "Back",
            "tabs.controlos": "Controls", "tabs.idioma": "Language", "tabs.audio": "Audio",
            "audio.som": "Sound Effects", "audio.volsfx": "SFX Volume", "audio.musica": "Background Music", "audio.volmus": "Music Vol",
            "hud.wave": "WAVE", "hud.pontos": "1UP", "hud.recorde": "HIGH SCORE", "hud.vidas": "LIVES", "hud.escudo": "SHIELD", "hud.onda": "SHOCKWAVE", "hud.dash": "DASH",
            "go.pontos": "SCORE", "go.recomecar": "INSERT COIN (Press ENTER)",
            "ctrl.ArrowLeft": "Move Left", "ctrl.ArrowRight": "Move Right", "ctrl.ArrowUp": "Thrust", "ctrl.ArrowDown": "Brake",
            "ctrl.KeyZ": "Shoot", "ctrl.KeyC": "Shield", "ctrl.KeyX": "Shockwave", "ctrl.Space": "Dash", "ui.teclado": "KEYBOARD", "ui.comando": "GAMEPAD"
        }
    };
    window.idiomaAtual = 'pt';

    
    function aplicarTraducoes() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const chave = el.getAttribute('data-i18n');
            if(dicionario[window.idiomaAtual][chave]) {
                if (el.id === 'btn-jogar' && window.jogoPausado) {
                    el.textContent = dicionario[window.idiomaAtual]["menu.continuar"];
                } else {
                    el.textContent = dicionario[window.idiomaAtual][chave];
                }
            }
        });
        construirListaControlos();
    }

    window.mapeamentoTeclas = {
        ArrowLeft: "Esquerda", ArrowRight: "Direita", ArrowUp: "Avançar", ArrowDown: "Recuar",
        KeyZ: "Disparar", KeyC: "Escudo", KeyX: "Onda", Space: "Dash"
    };

    function construirListaControlos() {
        const lista = document.getElementById('lista-mapeamento');
        lista.innerHTML = '';
        Object.keys(window.mapeamentoTeclas).forEach(teclaOriginal => {
            const funcao = window.mapeamentoTeclas[teclaOriginal];
            const nomeTraduzido = dicionario[window.idiomaAtual][`ctrl.${teclaOriginal}`] || funcao;
            
            const linha = document.createElement('div');
            linha.className = 'linha-controlo';
            linha.innerHTML = `<span>${nomeTraduzido}</span><button class="btn-captura" data-funcao="${funcao}">${teclaOriginal}</button>`;
            lista.appendChild(linha);
        });

        document.querySelectorAll('.btn-captura').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.btn-captura').forEach(b => b.classList.remove('escutando'));
                this.classList.add('escutando');
                this.textContent = window.idiomaAtual === 'pt' ? 'Prima uma tecla...' : 'Press a key...';
                window.funcaoEmCaptura = this.getAttribute('data-funcao');
                window.botaoEmCaptura = this;
            });
        });
    }

    const canvas = document.getElementById('menu-canvas');
    const ctx = canvas.getContext('2d');
    const estrelas = [];
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
    resize(); window.addEventListener('resize', resize);
    for (let i = 0; i < 220; i++) estrelas.push({ x: Math.random()*innerWidth, y: Math.random()*innerHeight, r: Math.random()*1.5+0.3, vel: Math.random()*0.4+0.1, b: Math.random() });
    (function loop() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const t = Date.now()*0.001;
        estrelas.forEach(e => {
            e.y += e.vel; if (e.y > canvas.height) { e.y = 0; e.x = Math.random()*canvas.width; }
            const a = 0.4 + 0.6*Math.abs(Math.sin(t*1.5+e.b*10));
            ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fill();
        });
        requestAnimationFrame(loop);
    })();

    document.querySelectorAll('.aba-link').forEach(link => {
        link.addEventListener('click', function() {
            document.querySelectorAll('.aba-link').forEach(l => l.classList.remove('ativo', 'ativa'));
            document.querySelectorAll('.aba-conteudo').forEach(c => c.classList.remove('ativa'));
            this.classList.add('ativa');
            document.getElementById(this.getAttribute('data-tab')).classList.add('ativa');
        });
    });

    document.getElementById('btn-definicoes').addEventListener('click', () => {
        document.getElementById('menu-botoes-raiz').style.display = 'none';
        document.getElementById('painel-definicoes').style.display = 'flex';
    });
    document.getElementById('btn-voltar-menu').addEventListener('click', () => {
        document.getElementById('painel-definicoes').style.display = 'none';
        document.getElementById('menu-botoes-raiz').style.display = 'flex';
    });
    document.getElementById('btn-quit').addEventListener('click', () => {
        window.close();
        alert(window.idiomaAtual === 'pt' ? "Jogo Encerrado! (Podes fechar o separador)" : "Game Over! (You can close the tab)");
    });

    document.getElementById('lang-pt').addEventListener('click', function() {
        document.getElementById('lang-en').classList.remove('ativo'); this.classList.add('ativo');
        window.idiomaAtual = 'pt'; aplicarTraducoes();
    });
    document.getElementById('lang-en').addEventListener('click', function() {
        document.getElementById('lang-pt').classList.remove('ativo'); this.classList.add('ativo');
        window.idiomaAtual = 'en'; aplicarTraducoes();
    });

    aplicarTraducoes();
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { fabricarInimigo2D } from './Inimigos2D.js'; 
        import { carregarNaveJogador, inicializarCacheInimigos3D, obterClone3DInimigo } from './Gestor3D.js';

        let uiEscudo, uiOnda, uiDash, uiWave;
        let scene, renderer, controls;
        let cameraPerspetiva, cameraOrtografica, cameraAtiva;
        let naveJogador, fundoEstrelas, malhaEscudo, malhaOnda;
        let visualBlocos = new THREE.Group(), visual3D = new THREE.Group();
        
        let lasers = [], arrayInimigos = [], explosoes = [], particulasRasto = [];
        let estadoTeclas = { Esquerda: false, Direita: false, Avançar: false, Recuar: false };
        
        let pontos = 0, vidas = 3;
        let pontuacaoMaxima = parseInt(localStorage.getItem('galaga_highscore')) || 0;
        let hudVisivel = true, jogoAcabou = false;
        window.jogoPausado = false;
        let invulneravel = false, tempoInvulneravel = 0, proximoBonusVida = 5000; 
        
        let waveAtual = 1;
        let lasersInimigos = [];
        const geoLaserInimigo = new THREE.CylinderGeometry(0.2, 0.2, 1.5);
        const matLaserCaca = new THREE.MeshBasicMaterial({ color: 0xff8800 });
        const geoLaserForte = new THREE.CylinderGeometry(0.5, 0.5, 2.5);
        const matLaserTanque = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        let escudoAtivo = false, cargaEscudo = 100, tempoFimEscudo = 0, ultimaAtualizacaoEscudo = Date.now();
        let ondaChoqueAtiva = false, raioOnda = 0, ultimoUsoOnda = 0;
        const COOLDOWN_ONDA = 15000;
        let ultimoUsoDash = 0;
        const COOLDOWN_DASH = 3000;

        let velNaveX = 0, velNaveY = 0;
        let ultimoDrawHUD = 0;
        let nivelEstrelas = 1;
        const geoLaserGlobal = new THREE.CylinderGeometry(0.15, 0.15, 2.0);
        const matLaserGlobal = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const geoExplosaoGlobal = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const materiaisExplosaoGlobais = [
            new THREE.MeshBasicMaterial({ color: 0xffff00 }),
            new THREE.MeshBasicMaterial({ color: 0x00ffff }),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        ];
        const geoRastoGlobal = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const matRastoGlobal = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 });
        const formaSeta = new THREE.Shape();
        formaSeta.moveTo(0, 1.5); formaSeta.lineTo(1, -0.5); formaSeta.lineTo(-1, -0.5); formaSeta.lineTo(0, 1.5);
        const geoSetaGlobal = new THREE.ShapeGeometry(formaSeta);
        const vetorMundoInimigo = new THREE.Vector3();
        const vecInim = new THREE.Vector3();

        let modoInicialCam = '3D';
        const audioManager = {
            somAtivo: true,
            volumeSFX: 0.1,
            music: { openingTheme: new Audio('Sounds/OpeningTheme.wav') },
            sfx: { gameLoad: new Audio('Sounds/gameLoad.wav') },
            volumeSFX: 0.15,
            volumeMusica: 0.15,

            music: {
                openingTheme: new Audio('Sounds/OpeningTheme.wav'),
                gameMusic: new Audio('Sounds/gameMusic.wav')
            },

            sfx: {
                gameLoad: new Audio('Sounds/gameLoad.wav'),
                GunShot: new Audio('Sounds/GunShot.wav'),
                CapturedFighter: new Audio('Sounds/CapturedFighter.wav'),
                OndaChoque: new Audio('Sounds/OndaChoque.wav') 
            },

            tocar(nome) {
                if (!this.somAtivo || !this.sfx[nome]) return;
                const som = this.sfx[nome].cloneNode();

      let ultimoSpawn = 0;
        // 1. AUMENTAR A BOLHA: Estava a 60, agora nascem a 180 (fora da câmara)
        const RAIO_BOLHA = 180; 
        
        function gerirSpawns() {
            if (jogoAcabou || window.jogoPausado) return;
            const agora = Date.now();
            
            if (agora - ultimoSpawn < Math.max(300, 1000 - (waveAtual * 50))) return;
            ultimoSpawn = agora;
            let contBoss = 0, contTanque = 0, contCaca = 0;
            let navesMaesVivas = [];
            arrayInimigos.forEach(inim => {
                if (inim.userData.tipo === 'Boss') { contBoss++; navesMaesVivas.push(inim); }
                if (inim.userData.tipo === 'Tanque') contTanque++;
                if (inim.userData.tipo === 'Caca') contCaca++;
            });
            if (contBoss >= 3 && contTanque >= 5 && contCaca >= 15) return;

            let tipoEscolhido = null;
            let sorteio = Math.random();
            if (contBoss < 3 && sorteio > 0.85) tipoEscolhido = 'Boss';
            else if (contTanque < 5 && contBoss > 0 && sorteio > 0.6) tipoEscolhido = 'Tanque';
            else if (contCaca < 15) tipoEscolhido = 'Caca';

            if (!tipoEscolhido) return;

            const anguloSpawn = Math.random() * Math.PI * 2;
            const spawnX = naveJogador.position.x + Math.cos(anguloSpawn) * RAIO_BOLHA;
            const spawnY = naveJogador.position.y + Math.sin(anguloSpawn) * RAIO_BOLHA;
            
            let inimigo = fabricarInimigo2D(
                tipoEscolhido, 
                tipoEscolhido === 'Boss' ? 1000 : (tipoEscolhido === 'Tanque' ? 300 : 100), 
                geoSetaGlobal, 
                scene
            );
            
            inimigo.add(obterClone3DInimigo(tipoEscolhido)); 
            inimigo.position.set(spawnX, spawnY, 0);
            
            if (tipoEscolhido === 'Boss') {
                inimigo.userData = { ...inimigo.userData, estado: 'MOTHERSHIP', ultimoTiro: Date.now(), velocidade: 0.04 };
            } 
            else if (tipoEscolhido === 'Tanque') {
                let chefeSorteado = navesMaesVivas[Math.floor(Math.random() * navesMaesVivas.length)];
                // 2. CORREÇÃO DE OFFSET: Empurra os tanques para 90~150 unidades de distância do Boss (para caberem as malhas)
                let sinalX = Math.random() < 0.5 ? -1 : 1;
                let sinalY = Math.random() < 0.5 ? -1 : 1;
                inimigo.userData = { 
                    ...inimigo.userData, 
                    estado: 'ESCOLTA', 
                    offsetX: sinalX * (90 + Math.random()*60), 
                    offsetY: sinalY * (90 + Math.random()*60), 
                    chefe: chefeSorteado, 
                    ultimoTiro: Date.now() + Math.random()*2000, 
                    velocidade: 0.06 
                };
            } 
            else if (tipoEscolhido === 'Caca') {
                // 3. AUMENTAR RAIO DE FLANCO: Os caças agora rodam mais longe (80~120) para não colidirem
                inimigo.userData = { 
                    ...inimigo.userData, 
                    estado: 'FLANQUEADOR', 
                    anguloFlanco: anguloSpawn, 
                    raioFlanco: 80 + Math.random()*40, 
                    ultimoTiro: Date.now() + Math.random()*2000, 
                    velocidade: 0.25 
                };
            }

            scene.add(inimigo); arrayInimigos.push(inimigo);
        }
        

        function executarDisparoJogador() {
            audioManager.tocar('GunShot')
            if(window.jogoPausado || jogoAcabou) return;
            const angulo = naveJogador.rotation.z;
            const dirX = -Math.sin(angulo), dirY = Math.cos(angulo);
            const latX = Math.cos(angulo), latY = Math.sin(angulo);
            const vTiro = 1.5, env = 2.0, proj = 3.5;   

            const lEsq = new THREE.Mesh(geoLaserGlobal, matLaserGlobal);
            lEsq.position.set(naveJogador.position.x - (latX*env) + (dirX*proj), naveJogador.position.y - (latY*env) + (dirY*proj), 0);
            lEsq.rotation.z = angulo; lEsq.userData = {velX: dirX*vTiro, velY: dirY*vTiro};
            scene.add(lEsq); lasers.push(lEsq);

            const lDir = new THREE.Mesh(geoLaserGlobal, matLaserGlobal);
            lDir.position.set(naveJogador.position.x + (latX*env) + (dirX*proj), naveJogador.position.y + (latY*env) + (dirY*proj), 0);
            lDir.rotation.z = angulo; lDir.userData = {velX: dirX*vTiro, velY: dirY*vTiro};
            scene.add(lDir); lasers.push(lDir);
        }

        function dispararInimigo(posicaoInimigo, velocidad, forte, anguloExtra = 0) {
            const geo = forte ? geoLaserForte : geoLaserInimigo;
            const mat = forte ? matLaserTanque : matLaserCaca;
            const tiro = new THREE.Mesh(geo, mat); tiro.position.copy(posicaoInimigo);
            
            // Calcula a direção base para o jogador e soma o desvio (V-shape)
            const anguloBase = Math.atan2(naveJogador.position.y - posicaoInimigo.y, naveJogador.position.x - posicaoInimigo.x);
            const anguloFinal = anguloBase + anguloExtra;
            
            tiro.rotation.z = anguloFinal - Math.PI/2;
            tiro.userData = { velX: Math.cos(anguloFinal) * velocidad, velY: Math.sin(anguloFinal) * velocidad };
            scene.add(tiro); lasersInimigos.push(tiro);
        }

       function lancarKamikaze(posicaoOrigem) {
            let kami = fabricarInimigo2D('Kamikaze', 200, geoSetaGlobal, scene);
            kami.position.copy(posicaoOrigem);
            
            // Direção inicial baseada na posição onde nasce (para não nascer de lado)
            const anguloInicial = Math.atan2(naveJogador.position.y - posicaoOrigem.y, naveJogador.position.x - posicaoOrigem.x);
            kami.userData = { ...kami.userData, estado: 'ATACANDO', anguloMovimento: anguloInicial, velocidade: 0.35 };
            kami.add(obterClone3DInimigo('Kamikaze'));
            
            // A CORREÇÃO: Faltava injetar a nave na cena e na lista do motor físico!
            scene.add(kami); 
            arrayInimigos.push(kami);
        }

        function atualizarBrilhoEstrelas() {

        }

        function onKeyDown(event) {
            if (window.funcaoEmCaptura) return;
            if (!window.jogoIniciado) return;
            if (jogoAcabou) { if (event.code === 'Enter') location.reload(); return; }

            
            if (event.code === 'Escape' || event.code === 'KeyP') { togglePausa(); return; }
            if (window.jogoPausado) return;
            if (event.code === 'KeyL') {
                nivelEstrelas = (nivelEstrelas + 1) % 4;
                atualizarBrilhoEstrelas();
            }

            if (event.key === 'Control') cameraAtiva = (cameraAtiva === cameraPerspetiva) ? cameraOrtografica : cameraPerspetiva;
            if (event.code === 'Tab') { event.preventDefault(); hudVisivel = !hudVisivel; document.getElementById('hud').style.display = hudVisivel ? 'block' : 'none'; }
            
            const acao = window.mapeamentoTeclas[event.code];
            if (acao) {
                if (acao === "Esquerda") estadoTeclas.Esquerda = true;
                if (acao === "Direita") estadoTeclas.Direita = true;
                if (acao === "Avançar") estadoTeclas.Avançar = true;
                if (acao === "Recuar") estadoTeclas.Recuar = true;
                if (acao === "Disparar") executarDisparoJogador();
                if (acao === "Escudo") despoletarEscudo();
                if (acao === "Onda") despoletarOndaChoque();
                if (acao === "Dash") despoletarDash();
                
                document.getElementById('icon-comando').classList.remove('ativo');
                document.getElementById('icon-teclado').classList.add('ativo');
            }
        }

        function onKeyUp(event) {
            const acao = window.mapeamentoTeclas[event.code];
            if (acao) {
                if (acao === "Esquerda") estadoTeclas.Esquerda = false;
                if (acao === "Direita") estadoTeclas.Direita = false;
                if (acao === "Avançar") estadoTeclas.Avançar = false;
                if (acao === "Recuar") estadoTeclas.Recuar = false;
            }
        }

        let travarBotaoPauseComando = false;
        let travarBotaoDisparoComando = false;
        let travarBotaoOndaComando = false;
        let travarBotaoDashComando = false;
        let travarBotaoEscudoComando = false;
        let travarBotaoEstrelasComando = false;

        function processarGamepadIO() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0]; 
            if (!gp) return;
            if(!document.getElementById('icon-comando').classList.contains('ativo')) {
                document.getElementById('icon-teclado').classList.remove('ativo');
                document.getElementById('icon-comando').classList.add('ativo');
            }

            if (gp.buttons[9].pressed) {
                if (!travarBotaoPauseComando) { togglePausa(); travarBotaoPauseComando = true; }
            } else { travarBotaoPauseComando = false; }

            if (window.jogoPausado || jogoAcabou) return;
            const eixoHorizontalL3 = gp.axes[0];
            estadoTeclas.Esquerda = gp.buttons[14].pressed || eixoHorizontalL3 < -0.3;
            estadoTeclas.Direita  = gp.buttons[15].pressed || eixoHorizontalL3 > 0.3;
            estadoTeclas.Avançar  = gp.buttons[12].pressed || gp.buttons[7].pressed;
            estadoTeclas.Recuar   = gp.buttons[13].pressed || gp.buttons[6].pressed;

            if (gp.buttons[0].pressed) {
                if (!travarBotaoDisparoComando) { executarDisparoJogador(); travarBotaoDisparoComando = true; }
            } else { travarBotaoDisparoComando = false; }

            if (gp.buttons[1].pressed) {
                if (!travarBotaoOndaComando) { despoletarOndaChoque(); travarBotaoOndaComando = true; }
            } else { travarBotaoOndaComando = false; }

            if (gp.buttons[2].pressed) {
                if (!travarBotaoDashComando) { despoletarDash(); travarBotaoDashComando = true; }
            } else { travarBotaoDashComando = false; }

            if (gp.buttons[3].pressed) {
                if (!travarBotaoEscudoComando) { despoletarEscudo(); travarBotaoEscudoComando = true; }
            } else { travarBotaoEscudoComando = false; }

            if (gp.buttons[4].pressed) {
                if (!travarBotaoEstrelasComando) {
                    nivelEstrelas = (nivelEstrelas + 1) % 4;
                    atualizarBrilhoEstrelas();
                    travarBotaoEstrelasComando = true; 
                }
            } else { 
                travarBotaoEstrelasComando = false;
            }
        }

        function onWindowResize() {
            const aspeto = window.innerWidth / window.innerHeight;
            cameraPerspetiva.aspect = aspeto; cameraPerspetiva.updateProjectionMatrix();
            const fS = 85;
            cameraOrtografica.left = -(fS*aspeto)/2; cameraOrtografica.right = (fS*aspeto)/2;
            cameraOrtografica.top = fS/2; cameraOrtografica.bottom = -fS/2;
            cameraOrtografica.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function criarFundo() {
            const canvasTmp = document.createElement('canvas');
            canvasTmp.width = 32; canvasTmp.height = 32;
            const ctxTmp = canvasTmp.getContext('2d');
            const grad = ctxTmp.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'white'); grad.addColorStop(0.2, 'rgba(200, 220, 255, 0.8)'); grad.addColorStop(1, 'transparent');
            ctxTmp.fillStyle = grad; ctxTmp.fillRect(0, 0, 32, 32);
            const tex = new THREE.CanvasTexture(canvasTmp); const geo = new THREE.BufferGeometry(); 
            const pos = new Float32Array(8000 * 3);
            for(let i = 0; i < 24000; i += 3) {
                pos[i] = (Math.random() - 0.5) * 800;
                pos[i+1] = (Math.random() - 0.5) * 800; pos[i+2] = (Math.random() - 0.5) * 40 - 60;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            fundoEstrelas = new THREE.Points(geo, new THREE.PointsMaterial({ 
                color: 0xffffff, size: 3.0, sizeAttenuation: false, map: tex, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false 
            }));
            fundoEstrelas.frustumCulled = false; scene.add(fundoEstrelas);
        }

        function animate() {
            if (jogoAcabou) { renderer.render(scene, cameraAtiva); return; }
            requestAnimationFrame(animate);

            const agora = Date.now();
            
            processarGamepadIO();
            if (!window.jogoIniciado || window.jogoPausado) {
                renderer.render(scene, cameraAtiva);
                return;
            }

            const angulo = naveJogador.rotation.z;
            if (cameraAtiva === cameraPerspetiva) {
                // 2ª ALTERAÇÃO: Aumentado o recuo (multiplicador 60) e a altura Z (de 20 para 100)
                cameraPerspetiva.position.set(naveJogador.position.x + Math.sin(angulo)*60, naveJogador.position.y - Math.cos(angulo)*60, 100);
                cameraPerspetiva.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
            } else {
                cameraOrtografica.position.set(naveJogador.position.x, naveJogador.position.y, 25);
                cameraOrtografica.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
            }
            controls.target.copy(naveJogador.position); controls.update();
            const vRot = 0.05, acel = 0.015, fricc = 0.985;
            if (estadoTeclas.Esquerda) naveJogador.rotation.z += vRot;
            if (estadoTeclas.Direita) naveJogador.rotation.z -= vRot;
            if (estadoTeclas.Avançar) {
                velNaveX -= Math.sin(naveJogador.rotation.z) * acel;
                velNaveY += Math.cos(naveJogador.rotation.z) * acel;
            }
            if (estadoTeclas.Recuar) {
                velNaveX += Math.sin(naveJogador.rotation.z) * (acel / 2);
                velNaveY -= Math.cos(naveJogador.rotation.z) * (acel / 2);
            }
            velNaveX *= fricc;
            velNaveY *= fricc;
            naveJogador.position.x += velNaveX; naveJogador.position.y += velNaveY;

            gerirSpawns();
            if (ondaChoqueAtiva) {
                raioOnda += 1.5;
                malhaOnda.scale.set(raioOnda, raioOnda, 1);
                malhaOnda.material.opacity = Math.max(0, 0.8 - (raioOnda / 60)); 
                const raioQuadrado = raioOnda * raioOnda;
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inim = arrayInimigos[j];
                    if (inim.position.distanceToSquared(malhaOnda.position) < raioQuadrado) {
                        criarExplosao(inim.position);
                        pontos += inim.userData.pontos;
                        if (inim.userData.setaGui) { scene.remove(inim.userData.setaGui); inim.userData.setaGui.material.dispose(); }
                        inim.parent.remove(inim);
                        arrayInimigos.splice(j, 1);
                    }
                }
                atualizarHUD();
                if (raioOnda > 60) { ondaChoqueAtiva = false; malhaOnda.visible = false; }
            }

          for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                let inim = arrayInimigos[j];
                let ud = inim.userData;
                if (!inim) continue;

                // === ALGORITMO DE REPULSÃO VETORIAL (Evita Sobreposição) ===
                // Se a nave 'j' estiver demasiado perto das naves 'k', empurram-se mutuamente
                for (let k = j - 1; k >= 0; k--) {
                    let outroInimigo = arrayInimigos[k];
                    let distInimigosSq = inim.position.distanceToSquared(outroInimigo.position);
                    // O valor 5000 representa um raio físico adequado às escalas que tens (impede cruzamentos)
                    if (distInimigosSq < 5000) {
                        let anguloAfastar = Math.atan2(inim.position.y - outroInimigo.position.y, inim.position.x - outroInimigo.position.x);
                        let forcaRepulsao = 0.5; // Suavidade com que deslizam uma na outra
                        inim.position.x += Math.cos(anguloAfastar) * forcaRepulsao;
                        inim.position.y += Math.sin(anguloAfastar) * forcaRepulsao;
                        outroInimigo.position.x -= Math.cos(anguloAfastar) * forcaRepulsao;
                        outroInimigo.position.y -= Math.sin(anguloAfastar) * forcaRepulsao;
                    }
                }
                // ============================================================

                if (ud.estado === 'MOTHERSHIP') {
                    let distSq = inim.position.distanceToSquared(naveJogador.position);
                    let anguloAlvo = Math.atan2(naveJogador.position.y - inim.position.y, naveJogador.position.x - inim.position.x);
                    
                    // 4. DISTÂNCIA DO BOSS: Aumentada de 2500 para 10000 para ele não engolir o jogador
                    if (distSq > 10000) { 
                        inim.position.x += Math.cos(anguloAlvo) * ud.velocidade;
                        inim.position.y += Math.sin(anguloAlvo) * ud.velocidade;
                    } else if (distSq < 8000) { 
                        inim.position.x -= Math.cos(anguloAlvo) * ud.velocidade;
                        inim.position.y -= Math.sin(anguloAlvo) * ud.velocidade;
                    }
                    inim.rotation.z = anguloAlvo - (Math.PI / 2);
                    // Onde dizia if (agora - ud.ultimoTiro > 3000) { ... } altera para:
                    if (agora - ud.ultimoTiro > 3000) {
                        // 1. Lança 1 Kamikaze
                        lancarKamikaze(new THREE.Vector3(inim.position.x, inim.position.y, 0));
                        
                        // 2. Rajada de 3 tiros em V (Tiro Forte, velocidade 0.7)
                        dispararInimigo(inim.position, 0.7, true, 0);     // Tiro Central
                        dispararInimigo(inim.position, 0.7, true, 0.35);  // Tiro Lateral Esquerdo
                        dispararInimigo(inim.position, 0.7, true, -0.35); // Tiro Lateral Direito
                        
                        ud.ultimoTiro = agora;
                    }
                } 
                else if (ud.estado === 'ESCOLTA') {
                    if (ud.chefe && ud.chefe.parent) {
                        let alvoX = ud.chefe.position.x + ud.offsetX;
                        let alvoY = ud.chefe.position.y + ud.offsetY;
                        inim.position.x += (alvoX - inim.position.x) * ud.velocidade; inim.position.y += (alvoY - inim.position.y) * ud.velocidade;
                    } else { ud.estado = 'ATACANDO'; }
                    
                    inim.rotation.z = Math.atan2(naveJogador.position.y - inim.position.y, naveJogador.position.x - inim.position.x) - (Math.PI / 2);
                    if (agora - ud.ultimoTiro > 5000) { dispararInimigo(inim.position, 0.6, true); ud.ultimoTiro = agora; }
                }
                else if (ud.estado === 'FLANQUEADOR') {
                    ud.anguloFlanco += 0.01;
                    let alvoX = naveJogador.position.x + Math.cos(ud.anguloFlanco) * ud.raioFlanco;
                    let alvoY = naveJogador.position.y + Math.sin(ud.anguloFlanco) * ud.raioFlanco;
                    let anguloMover = Math.atan2(alvoY - inim.position.y, alvoX - inim.position.x);
                    inim.position.x += Math.cos(anguloMover) * ud.velocidade; inim.position.y += Math.sin(anguloMover) * ud.velocidade;
                    inim.rotation.z = Math.atan2(naveJogador.position.y - inim.position.y, naveJogador.position.x - inim.position.x) - (Math.PI / 2);
                    if (agora - ud.ultimoTiro > 2000) { dispararInimigo(inim.position, 0.4, false); ud.ultimoTiro = agora + Math.random() * 1000; }
                }
                else if (ud.estado === 'ATACANDO') {
                    let anguloAlvo = Math.atan2(naveJogador.position.y - inim.position.y, naveJogador.position.x - inim.position.x);
                    let diffAngulo = anguloAlvo - ud.anguloMovimento;
                    while (diffAngulo <= -Math.PI) diffAngulo += Math.PI * 2;
                    while (diffAngulo > Math.PI) diffAngulo -= Math.PI * 2;
                    
                    ud.anguloMovimento += Math.max(-0.04, Math.min(0.04, diffAngulo));
                    inim.position.x += Math.cos(ud.anguloMovimento) * (ud.velocidade || 0.35); inim.position.y += Math.sin(ud.anguloMovimento) * (ud.velocidade || 0.35);
                    inim.rotation.z = ud.anguloMovimento - (Math.PI / 2);
                }

                let seta = ud.setaGui;
                if (seta) {
                    if (cameraAtiva === cameraPerspetiva) {
                        const dirSeta = new THREE.Vector3().subVectors(inim.position, naveJogador.position);
                        const dist = dirSeta.length(); dirSeta.normalize();
                        seta.position.copy(naveJogador.position).add(dirSeta.multiplyScalar(8));
                        seta.rotation.z = Math.atan2(dirSeta.y, dirSeta.x) - Math.PI / 2;
                        seta.material.opacity = THREE.MathUtils.clamp(1.0 - (dist / 120), 0.0, 0.8); seta.visible = true;
                    } else seta.visible = false;
                }

                if (inim.position.distanceToSquared(naveJogador.position) > 60000) {
                    if (ud.setaGui) { scene.remove(ud.setaGui); ud.setaGui.material.dispose(); }
                    scene.remove(inim);
                    arrayInimigos.splice(j, 1);
                }
            }

            if (!invulneravel) {
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inimigo = arrayInimigos[j];
                    inimigo.getWorldPosition(vetorMundoInimigo);

                    if (naveJogador.position.distanceToSquared(vetorMundoInimigo) < 9.0) {
                        if (escudoAtivo) {
                            criarExplosao(vetorMundoInimigo);
                            pontos += inimigo.userData.pontos;
                            if (inimigo.userData.setaGui) { scene.remove(inimigo.userData.setaGui); inimigo.userData.setaGui.material.dispose(); }
                            inimigo.parent.remove(inimigo);
                            arrayInimigos.splice(j, 1); atualizarHUD();
                        } else {
                            vidas--;
                            atualizarHUD(); criarExplosao(vetorMundoInimigo);
                            if (inimigo.userData.setaGui) { scene.remove(inimigo.userData.setaGui); inimigo.userData.setaGui.material.dispose(); }
                            inimigo.parent.remove(inimigo);
                            arrayInimigos.splice(j, 1);
                           if (vidas <= 0) {
                                document.getElementById('vidas').innerText = "0";
                                document.getElementById('pontuacao-final').innerText = pontos;
                                audioManager.music.gameMusic.pause();
                                audioManager.music.gameMusic.currentTime = 0;
                                audioManager.tocar('CapturedFighter')
                                document.getElementById('vidas').innerText = "0"; document.getElementById('pontuacao-final').innerText = pontos;
                                document.getElementById('ecra-gameover').style.display = 'flex'; jogoAcabou = true;
                            } else { invulneravel = true; tempoInvulneravel = Date.now(); }
                        }
                        break;
                    }
                }
            }

            for (let i = lasersInimigos.length - 1; i >= 0; i--) {
                let laser = lasersInimigos[i];
                laser.position.x += laser.userData.velX; laser.position.y += laser.userData.velY;

                if (!invulneravel && laser.position.distanceToSquared(naveJogador.position) < 4.0) {
                    if (!escudoAtivo) {
                        vidas--;
                        atualizarHUD(); criarExplosao(naveJogador.position);
                        if (vidas <= 0) {
                            document.getElementById('vidas').innerText = "0";
                            document.getElementById('pontuacao-final').innerText = pontos;
                            audioManager.music.gameMusic.pause();
                            audioManager.music.gameMusic.currentTime = 0;
                            audioManager.tocar('CapturedFighter');
                            document.getElementById('vidas').innerText = "0"; document.getElementById('pontuacao-final').innerText = pontos;
                            document.getElementById('ecra-gameover').style.display = 'flex'; jogoAcabou = true;
                        } else { invulneravel = true; tempoInvulneravel = agora; }
                    }
                    scene.remove(laser);
                    lasersInimigos.splice(i, 1); continue;
                }

                if (Math.abs(laser.position.x - naveJogador.position.x) > 100 || Math.abs(laser.position.y - naveJogador.position.y) > 100) {
                    scene.remove(laser);
                    lasersInimigos.splice(i, 1);
                }
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                let laser = lasers[i];
                laser.position.x += laser.userData.velX; laser.position.y += laser.userData.velY;
                let destruido = false;
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inim = arrayInimigos[j];
                    inim.getWorldPosition(vecInim);
                    
                    if (laser.position.distanceToSquared(vecInim) < 6.25) {
                        criarExplosao(vecInim);
                        if (inim.userData.setaGui) { scene.remove(inim.userData.setaGui); inim.userData.setaGui.material.dispose(); }
                        inim.parent.remove(inim);
                        arrayInimigos.splice(j, 1);
                        pontos += inim.userData.pontos; atualizarHUD();
                        scene.remove(laser); lasers.splice(i, 1); destruido = true; break;
                    }
                }
                if (!destruido) {
                    if (Math.abs(laser.position.x - naveJogador.position.x) > 80 || Math.abs(laser.position.y - naveJogador.position.y) > 80) {
                        scene.remove(laser);
                        lasers.splice(i, 1);
                    }
                }
            }
            
            for (let i = explosoes.length - 1; i >= 0; i--) {
                let exp = explosoes[i];
                exp.children.forEach(f => { f.position.x += f.userData.velX; f.position.y += f.userData.velY; f.scale.multiplyScalar(0.85); });
                exp.userData.tempoVida--; if (exp.userData.tempoVida <= 0) { scene.remove(exp); explosoes.splice(i, 1); }
            }
            if (estadoTeclas.Avançar) {
                const particula = new THREE.Mesh(geoRastoGlobal, matRastoGlobal);
                particula.position.set(naveJogador.position.x + Math.sin(naveJogador.rotation.z)*2, naveJogador.position.y - Math.cos(naveJogador.rotation.z)*2, 0);
                scene.add(particula); particulasRasto.push({ malha: particula, tempoVida: 1.0 });
            }
            for (let i = particulasRasto.length - 1; i >= 0; i--) {
                let p = particulasRasto[i];
                p.malha.position.y -= 0.2; p.malha.scale.multiplyScalar(0.85); p.tempoVida -= 0.05; 
                if (p.tempoVida <= 0) { scene.remove(p.malha); particulasRasto.splice(i, 1); }
            }

            if (invulneravel) {
                naveJogador.visible = Math.floor(agora / 100) % 2 === 0;
                if (agora - tempoInvulneravel > 2000) { invulneravel = false; naveJogador.visible = true; }
            }

            const modo3D = (cameraAtiva === cameraPerspetiva);
            visualBlocos.visible = !modo3D; 
            visual3D.visible = modo3D;

            arrayInimigos.forEach(inim => {
             inim.children.forEach(filho => {
            if (filho.name === "mesh3D") {
                filho.visible = modo3D;
            } else if (filho.geometry && filho.geometry.type === "BoxGeometry") {
                // Oculta/mostra os voxels 2D (Matrix) individualmente
                filho.visible = !modo3D;
            }
            });
            });

            if (escudoAtivo) {
                malhaEscudo.rotation.x += 0.05;
                malhaEscudo.rotation.y += 0.05; malhaEscudo.rotation.z += 0.02;
                if (agora > tempoFimEscudo) { escudoAtivo = false; malhaEscudo.visible = false; cargaEscudo = 0; }
            } else {
                if (cargaEscudo < 100) { cargaEscudo += (agora - ultimaAtualizacaoEscudo) * (100 / 15000);
                if (cargaEscudo > 100) cargaEscudo = 100; }
            }
            ultimaAtualizacaoEscudo = agora;
            if (hudVisivel && agora - ultimoDrawHUD > 50) {
                ultimoDrawHUD = agora;
                uiEscudo.style.width = Math.floor(cargaEscudo) + '%';
                uiEscudo.style.backgroundColor = cargaEscudo >= 100 ? '#00ffff' : '#ffaa00';
                const progressoOnda = Math.min(100, ((agora - ultimoUsoOnda) / COOLDOWN_ONDA) * 100);
                uiOnda.style.width = progressoOnda + '%';
                uiOnda.style.backgroundColor = progressoOnda >= 100 ? '#ff00ff' : '#550055';

                const progressoDash = Math.min(100, ((agora - ultimoUsoDash) / COOLDOWN_DASH) * 100);
                uiDash.style.width = progressoDash + '%'; uiDash.style.backgroundColor = progressoDash >= 100 ? '#ffff00' : '#555500';
            }
            
            if (fundoEstrelas) {
                const pos = fundoEstrelas.geometry.attributes.position.array;
                const cY = naveJogador.position.y; const cX = naveJogador.position.x;
                for(let i = 0; i < pos.length; i += 3) { 
                    pos[i+1] -= 0.5;
                    if (estadoTeclas.Avançar) pos[i+1] -= 1.0; 
                    if (pos[i+1] < cY - 400) pos[i+1] += 800;
                    else if (pos[i+1] > cY + 400) pos[i+1] -= 800;
                    if (pos[i] < cX - 400) pos[i] += 800;
                    else if (pos[i] > cX + 400) pos[i] -= 800;
                }
                fundoEstrelas.geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, cameraAtiva);
        }
    </script>
</body>
</html>
