<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Galaga 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold; text-align: center;
            display: none; /* Escondido por defeito, ativado com Tab */
            pointer-events: none; /* Deixa os cliques passarem para o jogo */
            z-index: 10;
        }
        .hud-container {
            display: flex; justify-content: space-around; padding-top: 20px;
        }
        .titulo { color: red; font-size: 28px; }
        .valor { color: white; font-size: 28px; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="hud">
        <div class="hud-container">
            <div>
                <div class="titulo">1UP</div>
                <div id="pontuacao" class="valor">0</div>
            </div>
            <div>
                <div class="titulo">HIGH SCORE</div>
                <div id="highscore" class="valor">20000</div>
            </div>
            <div>
                <div class="titulo">VIDAS</div>
                <div id="vidas" class="valor">3</div>
            </div>
        </div>
    </div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        
        let scene, renderer, controls;
        let cameraPerspetiva, cameraOrtografica, cameraAtiva;
        
        let naveJogador;
        let lasers = []; // Array para gerir os tiros em cena
        let teclas = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
        let ultimoDisparo = 0; // Controlo de cadência de tiro
        let explosoes = []; // Guarda as animações ativas
        let pontos = 0;
        let pontuacaoMaxima = 20000;
        let vidas = 3;
        let hudVisivel = false;

        let grupoFrota;
        let arrayInimigos = [];

        init();
        animate();

        // Inicialização
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020205); // Fundo quase preto (espaço)

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            configurarCamaras();
            configurarLuzes();
            criarNave();
            criarFrota();

            controls = new OrbitControls(cameraPerspetiva, renderer.domElement);
            controls.enableDamping = true;
            controls.enablePan = false; // Impede que o utilizador "arraste" a câmara para fora da nave
            controls.minDistance = 10;  // Limite de zoom aproximado
            controls.maxDistance = 60;  // Limite de zoom afastado

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            window.addEventListener('keyup', onKeyUp);
        }
        // Configuração da Câmara
        function configurarCamaras() {
            const aspeto = window.innerWidth / window.innerHeight;
            
            cameraPerspetiva = new THREE.PerspectiveCamera(45, aspeto, 0.1, 1000);
            cameraPerspetiva.position.set(0, -32, 18);

            const frustumSize = 85; 
            cameraOrtografica = new THREE.OrthographicCamera(
                (frustumSize * aspeto) / -2, (frustumSize * aspeto) / 2, 
                frustumSize / 2, frustumSize / -2, 0.1, 1000
            );
            cameraOrtografica.position.set(0, 5, 25);

            cameraAtiva = cameraOrtografica; // Arranca em 2D
        }
        // Luzes base
        function configurarLuzes() {
            const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.1); // Muito fraca
            scene.add(luzAmbiente);

            const luzDirecional = new THREE.DirectionalLight(0xaaaaaa, 1);
            luzDirecional.position.set(0, 0, 10);
            scene.add(luzDirecional);
        }
        
    
        function criarNave() {
            naveJogador = new THREE.Group();
            
            const geometria = new THREE.BoxGeometry(1, 1, 1); 

            // Cores
            const cB = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 }); // Branco
            const cV = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 }); // Vermelho
            const cA = new THREE.MeshStandardMaterial({ color: 0x0055ff, emissive: 0x001155 }); // Azul
            const cVerde = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x004400 }); // Verde
            const cVerdeEscuro = new THREE.MeshStandardMaterial({ color: 0x008800, emissive: 0x002200 }); // Verde Escuro
            const cCiano = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444 }); // Ciano
            const cAmarelo = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x444400 }); // Amarelo
            const cRoxo = new THREE.MeshStandardMaterial({ color: 0xaa00ff, emissive: 0x220044 }); // Roxo

            const designNave = [
                // Construção da nave
                [0, 15, cB], 
                [0, 14, cB], 
                [0, 13, cB],
                [-1, 12, cB], [ 0, 12, cB], [1, 12, cB],
                [-1, 11, cB], [ 0, 11, cB], [1, 11, cB], 
                [-1, 10, cB], [ 0, 10, cB], [1, 10, cB], [-4, 10, cV], [ 4, 10, cV], 
                [-1,  9, cB], [ 0,  9, cB], [1,  9, cB], [-4,  9, cV], [ 4,  9, cV], 
                [-4,  8, cB], [-2,  8, cB], [-1, 8, cB], [ 0,  8, cB], [ 1,  8, cB], [ 2,  8, cB], [ 4,  8, cB],
                [-7,  7, cV], [-4,  7, cB], [-3, 7, cA], [-2,  7, cB], [-1,  7, cB], [ 0,  7, cV], [ 1,  7, cB], [ 2,  7, cB], [ 3,  7, cA], [ 4,  7, cB], [ 7,  7, cV],
                [-7,  6, cV], [-4,  6, cA], [-3, 6, cB], [-2,  6, cB], [-1,  6, cV], [ 0,  6, cV], [ 1,  6, cV], [ 2,  6, cB], [ 3,  6, cB], [ 4,  6, cA], [ 7,  6, cV],
                [-7,  5, cB], [-4,  5, cB], [-3, 5, cB], [-2,  5, cB], [-1,  5, cV], [ 0,  5, cB], [ 1,  5, cV], [ 2,  5, cB], [ 3,  5, cB], [ 4,  5, cB], [ 7,  5, cB],
                [-7,  4, cB], [-5,  4, cB], [-4, 4, cB], [-3,  4, cB], [-2,  4, cB], [-1,  4, cB], [ 0,  4, cB], [ 1,  4, cB], [ 2,  4, cB], [ 3,  4, cB], [ 4,  4, cB], [ 5,  4, cB], [ 7,  4, cB],
                [-7,  3, cB], [-6,  3, cB], [-5, 3, cB], [-4,  3, cB], [-3,  3, cB], [-2,  3, cV], [-1,  3, cB], [ 0,  3, cB], [ 1,  3, cB], [ 2,  3, cV], [ 3,  3, cB], [ 4,  3, cB], [ 5,  3, cB], [ 6,  3, cB], [ 7,  3, cB],
                [-7,  2, cB], [-6,  2, cB], [-5, 2, cB], [-3,  2, cV], [-2,  2, cV], [-1,  2, cB], [ 0,  2, cB], [ 1,  2, cB], [ 2,  2, cV], [ 3,  2, cV], [ 5,  2, cB], [ 6,  2, cB], [ 7,  2, cB],
                [-7,  1, cB], [-6,  1, cB], [-3, 1, cV], [-2,  1, cV], [ 0,  1, cB], [ 2,  1, cV], [ 3,  1, cV], [ 6,  1, cB], [ 7,  1, cB],
                [-7,  0, cB], [ 0,  0, cB], [ 7, 0, cB],
              ]


            designNave.forEach(bloco => {
                const cubo = new THREE.Mesh(geometria, bloco[2]);
                cubo.position.set(bloco[0], bloco[1], 0);
                naveJogador.add(cubo);
            });

            naveJogador.scale.set(0.4, 0.4, 0.4);
            naveJogador.position.set(0, -35, 0); 
            scene.add(naveJogador);
        }        
          
        // Fábrica Genérica: Constrói 1 inimigo a partir de uma matriz
        function fabricarInimigo(matrizDesign, valorPontos) {
            const inimigo = new THREE.Group();
            const geometria = new THREE.BoxGeometry(1, 1, 1);
            
            matrizDesign.forEach(bloco => {
                const cubo = new THREE.Mesh(geometria, bloco[2]);
                cubo.position.set(bloco[0], bloco[1], 0);
                inimigo.add(cubo);
            });
            
            inimigo.scale.set(0.35, 0.35, 0.35); 
            
            // TRUQUE DE ENGENHARIA: Guardamos os pontos na memória interna deste objeto
            inimigo.userData.pontos = valorPontos; 
            
            return inimigo;
        }

        // Lógica de Geração da Frota (Requisito de Animação e Objetos)
        function criarFrota() {
            grupoFrota = new THREE.Group();

            // Cores
            const cB = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x444444 }); // Branco
            const cV = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x440000 }); // Vermelho
            const cA = new THREE.MeshStandardMaterial({ color: 0x0055ff, emissive: 0x001155 }); // Azul
            const cVerde = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x004400 }); // Verde
            const cVerdeEscuro = new THREE.MeshStandardMaterial({ color: 0x008800, emissive: 0x002200 }); // Verde Escuro
            const cCiano = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x004444 }); // Ciano
            const cAmarelo = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x444400 }); // Amarelo
            const cRoxo = new THREE.MeshStandardMaterial({ color: 0xaa00ff, emissive: 0x220044 }); // Roxo

            // Matriz do Zako
            const designZako = [
                [-5, 3, cA], [ 0, 3, cAmarelo], [ 5, 3, cA],
                [-4, 2, cA], [-2, 2, cAmarelo], [-1, 2, cV], [ 0, 2, cAmarelo], [1, 2, cV], [ 2, 2, cAmarelo], [ 4, 2, cA],
                [-3, 1, cA], [-2, 1, cV], [-1, 1, cV], [ 0, 1, cAmarelo], [1, 1, cV], [ 2, 1, cV], [ 3, 1, cA],
                [-2, 0, cAmarelo], [-1, 0, cAmarelo], [ 0, 0, cAmarelo], [1, 0, cAmarelo], [ 2, 0, cAmarelo],
                [-3, -1, cA], [-2, -1, cA], [-1, -1, cAmarelo], [ 0, -1, cAmarelo], [1, -1, cAmarelo], [ 2, -1, cA], [ 3, -1, cA],
                [-4, -2, cA], [-3, -2, cA], [-2, -2, cA], [-1, -2, cV], [ 0, -2, cV], [1, -2, cV], [ 2, -2, cA], [ 3, -2, cA], [ 4, -2, cA],
                [-5, -3, cA], [-4, -3, cA], [-3, -3, cA], [-1, -3, cV], [ 0, -3, cV], [1, -3, cV], [ 3, -3, cA], [ 4, -3, cA], [ 5, -3, cA],
                [-6, -4, cA], [-5, -4, cA], [-4, -4, cA], [-3, -4, cA], [-1, -4, cAmarelo], [ 0, -4, cAmarelo], [1, -4, cAmarelo], [ 3, -4, cA], [ 4, -4, cA], [ 5, -4, cA], [ 6, -4, cA],
                [-6, -5, cA], [-5, -5, cA], [-4, -5, cA], [-1, -5, cV], [ 0, -5, cV], [ 1, -5, cV], [ 4, -5, cA], [ 5, -5, cA], [ 6, -5, cA],
                [-6, -6, cA], [-5, -6, cA], [-4, -6, cA], [ 0, -6, cV], [ 4, -6, cA], [ 5, -6, cA], [ 6, -6, cA],
            ];

            const designGoei = [
                [-4, 16, cV], [-1, 16, cA], [ 1, 16, cA], [ 4, 16, cV],
                [-6, 15, cV], [-5, 15, cV], [-4, 15, cV], [-1, 15, cA], [ 1, 15, cA], [ 4, 15, cV], [ 5, 15, cV], [ 6, 15, cV],
                [-6, 14, cV], [-5, 14, cV], [-4, 14, cV], [-2, 14, cB], [-1, 14, cV], [ 0, 14, cB], [ 1, 14, cV], [ 2, 14, cB], [ 4, 14, cV], [ 5, 14, cV], [ 6, 14, cV],
                [-6, 13, cV], [-5, 13, cV], [-4, 13, cV], [-2, 13, cB], [-1, 13, cB], [ 0, 13, cB], [ 1, 13, cB], [ 2, 13, cB], [ 4, 13, cV], [ 5, 13, cV], [ 6, 13, cV],
                [-5, 12, cV], [-4, 12, cV], [-3, 12, cV], [-2, 12, cV], [-1, 12, cB], [ 0, 12, cB], [ 1, 12, cB], [ 2, 12, cV], [ 3, 12, cV], [ 4, 12, cV], [ 5, 12, cV], 
                [-5, 11, cV], [-4, 11, cV], [-3, 11, cV], [-2, 11, cV], [-1, 11, cA], [ 0, 11, cA], [ 1, 11, cA], [ 2, 11, cV], [ 3, 11, cV], [ 4, 11, cV], [ 5, 11, cV], 
                [-4, 10, cV], [-3, 10, cV], [-2, 10, cV], [-1, 10, cA], [ 0, 10, cA], [ 1, 10, cA], [ 2, 10, cV], [ 3, 10, cV], [ 4, 10, cV],  
                [-5,  9, cV], [-4,  9, cV], [-3,  9, cV], [-2,  9, cV], [-1,  9, cA], [ 0,  9, cA], [ 1,  9, cA], [ 2,  9, cV], [ 3,  9, cV], [ 4,  9, cV], [ 5,  9, cV], 
                [-6,  8, cV], [-5,  8, cV], [-4,  8, cV], [-3,  8, cV], [-2,  8, cV], [-1,  8, cB], [ 0,  8, cB], [ 1,  8, cB], [ 2,  8, cV], [ 3,  8, cV], [ 4,  8, cV], [ 5,  8, cV], [ 6,  8, cV],
                [-5,  7, cV], [-4,  7, cV], [-3,  7, cV], [-2,  7, cV], [-1,  7, cA], [ 0,  7, cA], [ 1,  7, cA], [ 2,  7, cV], [ 3,  7, cV], [ 4,  7, cV], [ 5,  7, cV], 
                [-3,  6, cV], [ 3,  6, cV],
            ];

            const designBoss = [

            ];

            // Ciclo duplo para criar uma grelha: 2 Linhas, 5 Colunas
            const colunas = 10;
            const linhas = 4;
            const espacamentoX = 6.5;
            const espacamentoY = 4.5;

            for (let linha = 0; linha < linhas; linha++) {
                for (let col = 0; col < colunas; col++) {
                    
                    let designEscolhido;

                    // O algoritmo decide que matriz usar com base na linha (0 a 4)
                    if (linha === 0) {
                        designEscolhido = designBoss; // Linha 0 (Topo): Boss Galaga
                    } else if (linha === 1 || linha === 2) {
                        designEscolhido = designGoei; // Linhas 1 e 2: Goei (Borboletas)
                    } else {
                        designEscolhido = designZako; // Linhas 3 e 4: Zako (Moscas)
                    }

                    const inimigo = fabricarInimigo(designEscolhido);
                    
                    inimigo.position.x = (col * espacamentoX) - ((colunas - 1) * espacamentoX) / 2;
                    inimigo.position.y = - (linha * espacamentoY);
                    
                    grupoFrota.add(inimigo);
                    arrayInimigos.push(inimigo);

                for (let linha = 0; linha < linhas; linha++) 
                {
                    for (let col = 0; col < colunas; col++) 
                    {
                    
                    let designEscolhido;
                    let pontosDestaNave; // Nova variável para a pontuação

                    // O algoritmo decide a matriz e a pontuação com base na linha
                    if (linha === 0) {
                        designEscolhido = designBoss; 
                        pontosDestaNave = 160; // Boss Galaga vale 400 pontos
                    } else if (linha === 1 || linha === 2) {
                        designEscolhido = designGoei;
                        pontosDestaNave = 100; // Borboletas valem 160 pontos
                    } else {
                        designEscolhido = designZako;
                        pontosDestaNave = 50;  // Moscas valem 80 pontos
                    }

                    // Passamos o design e os pontos para a fábrica
                    const inimigo = fabricarInimigo(designEscolhido, pontosDestaNave);
                    
                    inimigo.position.x = (col * espacamentoX) - ((colunas - 1) * espacamentoX) / 2;
                    inimigo.position.y = - (linha * espacamentoY);
                    
                    grupoFrota.add(inimigo);
                    arrayInimigos.push(inimigo);
                    }
                }
                }
            }

            // Posiciona a frota no topo do ecrã
            grupoFrota.position.set(0, 20, 0);
            scene.add(grupoFrota);
        }
    

     function disparar() {
            const agora = Date.now();
            if (agora - ultimoDisparo < 250) return; 
            ultimoDisparo = agora;

            const geometriaLaser = new THREE.CylinderGeometry(0.1, 0.1, 1.5);
            const materialLaser = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const laser = new THREE.Mesh(geometriaLaser, materialLaser);

            const luzLaser = new THREE.PointLight(0xff0000, 2, 10);
            laser.add(luzLaser);

            // 1. O laser nasce na posição da nave
            laser.position.copy(naveJogador.position);
            
            // 2. O laser roda visualmente para ficar com o mesmo ângulo da nave
            laser.rotation.z = naveJogador.rotation.z;

            // 3. MATEMÁTICA: Guardamos o vetor de velocidade (Seno para o X, Cosseno para o Y)
            const velocidadeTiro = 0.8;
            laser.userData.velX = -Math.sin(naveJogador.rotation.z) * velocidadeTiro;
            laser.userData.velY = Math.cos(naveJogador.rotation.z) * velocidadeTiro;

            // Empurrar o laser ligeiramente para a frente para não nascer dentro do cockpit
            laser.position.x += laser.userData.velX * 3;
            laser.position.y += laser.userData.velY * 3;

            scene.add(laser);
            lasers.push(laser);
        }

        // --- SISTEMA DE UI (HUD) ---
        function atualizarHUD() {
            // Atualiza o recorde se passares a pontuação
            if (pontos > pontuacaoMaxima) pontuacaoMaxima = pontos;
            
            // Injeta os valores no HTML
            document.getElementById('pontuacao').innerText = pontos;
            document.getElementById('highscore').innerText = pontuacaoMaxima;
            document.getElementById('vidas').innerText = vidas;
        }

        // --- SISTEMA DE PARTÍCULAS (Animação de Morte) ---
        function criarExplosao(posicaoMundo) {
            const grupoExplosao = new THREE.Group();
            grupoExplosao.position.copy(posicaoMundo); // Nasce exatamente onde o inimigo estava

            // As cores clássicas da explosão da arcada
            const cores = [0xffff00, 0x00ffff, 0xffffff]; // Amarelo, Ciano, Branco
            const geometriaPixel = new THREE.BoxGeometry(0.8, 0.8, 0.8);

            // Criar 8 fragmentos que saltam do inimigo
            for (let i = 0; i < 8; i++) {
                const material = new THREE.MeshBasicMaterial({ 
                    color: cores[Math.floor(Math.random() * cores.length)] 
                });
                const fragmento = new THREE.Mesh(geometriaPixel, material);
                
                // Matemática Trigonométrica: Atira cada fragmento num ângulo diferente formando um círculo
                const angulo = (i / 8) * Math.PI * 2;
                const velocidadeEstilhaco = 0.6;
                fragmento.userData.velX = Math.cos(angulo) * velocidadeEstilhaco;
                fragmento.userData.velY = Math.sin(angulo) * velocidadeEstilhaco;
                
                grupoExplosao.add(fragmento);
            }

            // A explosão dura 20 frames antes de desaparecer
            grupoExplosao.userData.tempoVida = 20; 
            
            scene.add(grupoExplosao);
            explosoes.push(grupoExplosao);
        }

        function onKeyDown(event) {
            if (event.key === 'Control') {
                cameraAtiva = (cameraAtiva === cameraPerspetiva) ? cameraOrtografica : cameraPerspetiva;
            }
            if (event.code === 'ArrowLeft') teclas.ArrowLeft = true;
            if (event.code === 'ArrowRight') teclas.ArrowRight = true;
            if (event.code === 'ArrowUp') teclas.ArrowUp = true;
            if (event.code === 'ArrowDown') teclas.ArrowDown = true;
            if (event.code === 'Space') disparar();
            if (event.code === 'Tab') {
                event.preventDefault(); // Impede que o browser mude de janela/seleção
                hudVisivel = !hudVisivel; // Alterna entre true e false
                document.getElementById('hud').style.display = hudVisivel ? 'block' : 'none';
            }
        }

        function onKeyUp(event) {
            if (event.code === 'ArrowLeft') teclas.ArrowLeft = false;
            if (event.code === 'ArrowRight') teclas.ArrowRight = false;
            if (event.code === 'ArrowUp') teclas.ArrowUp = false;
            if (event.code === 'ArrowDown') teclas.ArrowDown = false;
        }

        function onWindowResize() {
            const aspeto = window.innerWidth / window.innerHeight;
            
            // Atualizar a matemática da câmara 3D
            cameraPerspetiva.aspect = aspeto;
            cameraPerspetiva.updateProjectionMatrix();

            // Atualizar a matemática da câmara 2D (Faltava isto!)
            const frustumSize = 85;
            cameraOrtografica.left = - (frustumSize * aspeto) / 2;
            cameraOrtografica.right = (frustumSize * aspeto) / 2;
            cameraOrtografica.top = frustumSize / 2;
            cameraOrtografica.bottom = - frustumSize / 2;
            cameraOrtografica.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // --- CÂMARA DE PERSEGUIÇÃO DINÂMICA (Chase Cam) ---
            const angulo = naveJogador.rotation.z; // Ângulo atual da nave
            const distancia = 30; // Quão longe a câmara está atrás
            const altura = 20;    // Quão alta a câmara está

            if (cameraAtiva === cameraPerspetiva) {
                // MATEMÁTICA: Calculamos a posição da câmara usando o vetor inverso do bico da nave
                // Se a nave aponta para 'angulo', a câmara deve estar em 'angulo + PI'
                cameraPerspetiva.position.x = naveJogador.position.x + Math.sin(angulo) * distancia;
                cameraPerspetiva.position.y = naveJogador.position.y - Math.cos(angulo) * distancia;
                cameraPerspetiva.position.z = altura;

                // TRUQUE DE ENGENHARIA: Alinhamos o "Up" da câmara com o "Frente" da nave
                // Isto faz com que o ecrã rode para manter a nave vertical
                cameraPerspetiva.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
                
                controls.target.copy(naveJogador.position);
            } else {
                // No modo 2D, fazemos o mesmo para o scroll acompanhar a rotação visual
                cameraOrtografica.position.x = naveJogador.position.x;
                cameraOrtografica.position.y = naveJogador.position.y;
                cameraOrtografica.up.set(-Math.sin(angulo), Math.cos(angulo), 0);
                controls.target.copy(naveJogador.position);
            }
            
            controls.update();
            
            controls.update();

            // Movimento da Nave (Rotação 360º e Propulsão)
            const velocidadeRotacao = 0.05;
            const velocidadeMovimento = 0.4;

            // Setas Esquerda/Direita agora giram a nave no eixo Z
            if (teclas.ArrowLeft) naveJogador.rotation.z += velocidadeRotacao;
            if (teclas.ArrowRight) naveJogador.rotation.z -= velocidadeRotacao;

            // Setas Cima/Baixo empurram a nave na direção em que ela está a olhar
            if (teclas.ArrowUp) {
                naveJogador.position.x -= Math.sin(naveJogador.rotation.z) * velocidadeMovimento;
                naveJogador.position.y += Math.cos(naveJogador.rotation.z) * velocidadeMovimento;
            }
            if (teclas.ArrowDown) {
                naveJogador.position.x += Math.sin(naveJogador.rotation.z) * (velocidadeMovimento / 2); // Marcha atrás mais lenta
                naveJogador.position.y -= Math.cos(naveJogador.rotation.z) * (velocidadeMovimento / 2);
            }

            // Variável temporária para extrair as coordenadas globais
            const vetorMundoInimigo = new THREE.Vector3();

            // --- LÓGICA DE TIRO E COLISÃO ---
            for (let i = lasers.length - 1; i >= 0; i--) {
                let laser = lasers[i];
                laser.position.x += laser.userData.velX;
                laser.position.y += laser.userData.velY;
                
                let laserDestruido = false;

                // Verificar colisão contra toda a frota
                for (let j = arrayInimigos.length - 1; j >= 0; j--) {
                    let inimigo = arrayInimigos[j];
                    
                    // Extrair a verdadeira posição do inimigo no espaço 3D global
                    inimigo.getWorldPosition(vetorMundoInimigo);

                    // Se a distância entre o laser e o centro do inimigo for menor que 2.5 unidades
                    if (laser.position.distanceTo(vetorMundoInimigo) < 2.5) {
                        
                        // 1. Nasce a Explosão
                        criarExplosao(vetorMundoInimigo);

                        // 2. Apagar Inimigo
                        grupoFrota.remove(inimigo); // Apaga do ecrã
                        arrayInimigos.splice(j, 1); // Apaga da memória

                        pontos += inimigo.userData.pontos;
                        atualizarHUD();

                        // 3. Apagar Laser
                        scene.remove(laser);
                        lasers.splice(i, 1);
                        laserDestruido = true;
                        
                        break; // Bateu, paramos de verificar outros inimigos para este laser
                    }
                }

                if (laserDestruido) continue; // Pula para o próximo laser se este explodiu

                // Destruir laser se for para fora do mapa (Otimização de memória)
                if (Math.abs(laser.position.x) > 60 || Math.abs(laser.position.y) > 60) {
                    scene.remove(laser);
                    lasers.splice(i, 1);
                }
            }

            // --- ANIMAÇÃO DAS PARTÍCULAS DE EXPLOSÃO ---
            for (let i = explosoes.length - 1; i >= 0; i--) {
                let exp = explosoes[i];
                
                // Mover cada píxel da explosão para fora e encolhê-lo
                exp.children.forEach(fragmento => {
                    fragmento.position.x += fragmento.userData.velX;
                    fragmento.position.y += fragmento.userData.velY;
                    fragmento.scale.multiplyScalar(0.85); // Efeito de desvanecimento
                });

                exp.userData.tempoVida--;

                // Quando o tempo acabar, limpa a explosão da memória
                if (exp.userData.tempoVida <= 0) {
                    scene.remove(exp);
                    explosoes.splice(i, 1);
                }
            }

            renderer.render(scene, cameraAtiva);
        }
    </script>
</body>
